<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="description" content="Ringify — Music, Radio & Live TV in one place">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ringify</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%231ed760'/%3E%3Ccircle cx='20' cy='20' r='7' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<style>
/*═══════════════════════════════════════════════════════════════
  RINGIFY v6 — DESIGN SYSTEM + COMPLETE CSS
  Premium single-file Music / Radio / TV app
  Part 1/8 — Foundation
═══════════════════════════════════════════════════════════════*/

/* ============================================================
   DESIGN TOKENS
============================================================ */
:root,[data-theme="dark"]{
/* Brand */
--accent:#1ed760;--accent2:#1db954;--accentD:rgba(30,215,96,.08);--accentG:rgba(30,215,96,.16);
--radio:#f97316;--radioD:rgba(249,115,22,.08);
--tv:#06b6d4;--tvD:rgba(6,182,212,.08);
--artist:#3b82f6;--artistD:rgba(59,130,246,.08);
--danger:#ef4444;--dangerD:rgba(239,68,68,.1);
--gold:#fbbf24;

/* Surfaces */
--bg:#000;--bg1:#0a0a0a;--bg2:#131313;--bg3:#1c1c1c;--bg4:#262626;--bg5:#333;
--card:#151515;--card-h:#1d1d1d;

/* Text */
--t1:#fff;--t2:#a7a7a7;--t3:#6e6e6e;--t4:#3d3d3d;

/* Borders / states */
--brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.12);
--hover:rgba(255,255,255,.045);--active:rgba(255,255,255,.09);

/* Elevation */
--e1:0 2px 8px rgba(0,0,0,.28);
--e2:0 6px 20px rgba(0,0,0,.4);
--e3:0 14px 44px rgba(0,0,0,.5);
--e4:0 28px 70px rgba(0,0,0,.62);
--sh:var(--e2);--sh2:var(--e3);

/* Radius */
--r-sm:6px;--r:8px;--r2:12px;--r3:9999px;

/* Motion */
--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.175,.885,.32,1.275);--out:cubic-bezier(0,0,.2,1);
--dur-f:.1s;--dur-m:.18s;--dur-s:.3s;

/* Type scale */
--fs-2xs:8px;--fs-xs:9px;--fs-sm:10px;--fs-base:11px;--fs-md:12px;--fs-lg:14px;--fs-xl:16px;--fs-2xl:20px;--fs-3xl:28px;

/* Spacing scale (4px base) */
--sp-1:2px;--sp-2:4px;--sp-3:6px;--sp-4:8px;--sp-5:10px;--sp-6:12px;--sp-7:16px;--sp-8:20px;--sp-9:24px;--sp-10:32px;

/* Layout */
--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
--player-h:70px;--sb-w:236px;--nav-h:54px;--topbar-h:42px;--tabs-h:34px;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);

/* Z-index scale */
--z-sticky:40;--z-topbar:50;--z-mobplayer:150;--z-mobnav:200;--z-fx:250;--z-npo:270;--z-settings:300;--z-mfp:300;
--z-modal:99995;--z-ctx:99998;--z-toast:99999;
}
[data-theme="amoled"]{--bg:#000;--bg1:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1e1e1e;--bg5:#282828;--card:#0a0a0a;--card-h:#141414}
[data-theme="midnight"]{--accent:#60a5fa;--accentD:rgba(96,165,250,.08);--accentG:rgba(96,165,250,.16);--bg:#040a18;--bg1:#061020;--bg2:#0a1628;--bg3:#0f1e38;--bg4:#162848;--bg5:#1e3458;--card:#0a1628;--card-h:#0f1e38}
[data-theme="forest"]{--accent:#4ade80;--accentD:rgba(74,222,128,.08);--accentG:rgba(74,222,128,.16);--bg:#040a04;--bg1:#061006;--bg2:#0a1a0a;--bg3:#0f240f;--bg4:#163016;--bg5:#1e3c1e;--card:#0a1a0a;--card-h:#0f240f}
[data-theme="sunset"]{--accent:#fb923c;--accentD:rgba(251,146,60,.08);--accentG:rgba(251,146,60,.16);--bg:#0a0604;--bg1:#120a06;--bg2:#1a0f0a;--bg3:#24160f;--bg4:#2e1e16;--bg5:#38261e;--card:#1a0f0a;--card-h:#24160f}
[data-theme="purple"]{--accent:#a78bfa;--accentD:rgba(167,139,250,.08);--accentG:rgba(167,139,250,.16);--bg:#06040a;--bg1:#0a0610;--bg2:#0f0a1a;--bg3:#160f24;--bg4:#1e162e;--bg5:#261e38;--card:#0f0a1a;--card-h:#160f24}

/* Reduced motion override target */
[data-reduced="1"]{--dur-f:0s;--dur-m:0s;--dur-s:0s}

/* ============================================================
   RESET
============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg1);color:var(--t1);font-size:var(--fs-base);-webkit-font-smoothing:antialiased;line-height:1.45;touch-action:manipulation}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.14)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;transition:background var(--dur-f) var(--ease),color var(--dur-f) var(--ease),transform var(--dur-f) var(--ease),opacity var(--dur-f) var(--ease),border-color var(--dur-f) var(--ease)}
input,textarea,select{font-family:var(--font);color:var(--t1);background:none;border:none;outline:none}
img{display:block;-webkit-user-drag:none;user-select:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#000}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;white-space:nowrap;border:0;clip:rect(0,0,0,0)}
[disabled]{pointer-events:none;opacity:.45}

/* ============================================================
   TYPE / SPACING / COLOR UTILITIES (used by later JS renders)
============================================================ */
.u-fs-2xs{font-size:var(--fs-2xs)}.u-fs-xs{font-size:var(--fs-xs)}.u-fs-sm{font-size:var(--fs-sm)}
.u-fs-base{font-size:var(--fs-base)}.u-fs-md{font-size:var(--fs-md)}.u-fs-lg{font-size:var(--fs-lg)}
.u-c1{color:var(--t1)}.u-c2{color:var(--t2)}.u-c3{color:var(--t3)}.u-c4{color:var(--t4)}
.u-bold{font-weight:700}.u-black{font-weight:900}
.u-ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u-flex{display:flex;align-items:center}
.u-gap4{gap:var(--sp-4)}.u-gap6{gap:var(--sp-6)}

/* ============================================================
   APP SHELL
============================================================ */
.app{display:grid;grid-template-rows:1fr var(--player-h);height:100dvh;overflow:hidden;background:var(--bg)}
.layout{display:grid;grid-template-columns:var(--sb-w) 1fr;gap:var(--sp-2);padding:var(--sp-2) var(--sp-2) 0;overflow:hidden;height:100%}

/* Gradient wash behind detail pages */
.cgrad{position:absolute;top:0;left:0;right:0;height:400px;pointer-events:none;z-index:0;opacity:.75;
background:linear-gradient(180deg,var(--grad-top,rgba(20,30,50,.5)) 0%,var(--grad-mid,rgba(15,20,35,.3)) 26%,rgba(19,19,19,.6) 50%,rgba(19,19,19,.92) 72%,var(--bg2) 100%);
transition:background var(--dur-s) var(--ease)}

/* ============================================================
   SIDEBAR
============================================================ */
.sb{display:flex;flex-direction:column;gap:var(--sp-2);overflow:hidden}
.sb-nav{background:var(--bg2);border-radius:var(--r);padding:var(--sp-5);border:1px solid var(--brd)}
.logo{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-1) var(--sp-4);margin-bottom:var(--sp-6)}
.logo svg{width:26px;height:26px;flex-shrink:0}
.logo span{font-size:var(--fs-xl);font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),#a3e635);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-i{display:flex;align-items:center;gap:var(--sp-5);padding:var(--sp-4) var(--sp-5);border-radius:var(--r-sm);font-size:var(--fs-base);font-weight:600;color:var(--t2);width:100%;position:relative}
.nav-i:hover{color:var(--t1);background:var(--hover)}
.nav-i.on{color:var(--t1);background:var(--active)}
.nav-i.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 2px 2px 0;background:var(--accent)}
.nav-i svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:var(--fs-2xs);font-weight:800;color:var(--accent);background:var(--accentD);padding:1px 5px;border-radius:var(--r3)}

.sb-lib{background:var(--bg2);border-radius:var(--r);flex:1;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--brd)}
.lib-head{padding:var(--sp-5) var(--sp-6) var(--sp-3);display:flex;align-items:center;justify-content:space-between}
.lib-head span{font-size:var(--fs-xs);font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px}
.lib-add{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--t3)}
.lib-add:hover{color:var(--t1);background:var(--bg4)}
.lib-add svg{width:13px;height:13px}
.lib-list{flex:1;overflow-y:auto;padding:var(--sp-1) var(--sp-3) var(--sp-4)}
.lib-item{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-3);border-radius:var(--r-sm);cursor:pointer}
.lib-item:hover{background:var(--hover)}
.lib-item.on{background:var(--accentD)}
.lib-thumb{width:36px;height:36px;border-radius:5px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:grid;place-items:center}
.lib-thumb.round{border-radius:50%}
.lib-thumb img{width:100%;height:100%;object-fit:cover}
.lib-thumb svg{width:14px;height:14px;color:var(--t4)}
.lib-text{flex:1;overflow:hidden}
.lib-name{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-meta{font-size:var(--fs-2xs);color:var(--t3);margin-top:1px;display:flex;align-items:center;gap:3px}
.lib-empty{padding:var(--sp-7) var(--sp-6);text-align:center;color:var(--t3);font-size:var(--fs-xs)}
.lib-filter{display:flex;gap:3px;padding:0 var(--sp-4) var(--sp-3)}
.lib-filter button{font-size:var(--fs-2xs);font-weight:700;color:var(--t3);padding:2px 7px;border-radius:var(--r3);background:var(--bg3)}
.lib-filter button.on{background:var(--bg5);color:var(--t1)}

/* ============================================================
   CENTER PANEL
============================================================ */
.center{background:var(--bg2);border-radius:var(--r);overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column;border:1px solid var(--brd);scroll-behavior:smooth}

/* Topbar */
.topbar{position:sticky;top:0;z-index:var(--z-topbar);height:var(--topbar-h);padding:0 var(--sp-6);display:flex;align-items:center;gap:var(--sp-3);transition:background var(--dur-m),box-shadow var(--dur-m)}
.topbar.stuck{background:rgba(10,10,10,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 6px rgba(0,0,0,.25)}
.tb-back,.tb-fwd{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;color:var(--t1)}
.tb-back:hover,.tb-fwd:hover{background:rgba(0,0,0,.62)}
.tb-back.off,.tb-fwd.off{opacity:.25;pointer-events:none}
.tb-back svg,.tb-fwd svg{width:12px;height:12px}

/* Search */
.search-w{flex:1;max-width:380px;position:relative}
.search-w svg.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--t3);pointer-events:none;transition:color var(--dur-f)}
.search-w input{width:100%;padding:7px 30px 7px 30px;background:var(--bg4);border:1.5px solid transparent;border-radius:var(--r3);font-size:var(--fs-sm);font-weight:500;transition:background var(--dur-f),border-color var(--dur-f)}
.search-w input:focus{background:var(--bg5);border-color:var(--accent)}
.search-w:focus-within svg.si{color:var(--accent)}
.search-w input::placeholder{color:var(--t3)}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;display:none;place-items:center;color:var(--t3);background:var(--bg5)}
.search-clear.show{display:grid}
.search-clear:hover{color:var(--t1);background:var(--bg4)}
.search-clear svg{width:9px;height:9px}

.sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--r);max-height:320px;overflow-y:auto;z-index:200;display:none;box-shadow:var(--e3)}
.sug.show{display:block;animation:fUp .12s var(--ease)}
@keyframes fUp{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.sug-i{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-5);cursor:pointer}
.sug-i:hover,.sug-i.hl{background:var(--hover)}
.sug-i img{width:30px;height:30px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--bg4)}
.sug-i .round{border-radius:50%}
.sug-info{flex:1;overflow:hidden}
.sug-t{font-size:var(--fs-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-s{font-size:var(--fs-2xs);color:var(--t3)}
.sug-type{font-size:var(--fs-2xs);color:var(--t3);text-transform:uppercase;font-weight:700;letter-spacing:.2px;padding:2px 5px;border-radius:var(--r3);background:var(--bg4);flex-shrink:0}
.sug-head{padding:var(--sp-3) var(--sp-5) 3px;font-size:var(--fs-2xs);font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.4px}
.sug-recent-row{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3) var(--sp-5) 0}
.sug-recent-row button{font-size:var(--fs-2xs);color:var(--t3);font-weight:600}
.sug-recent-row button:hover{color:var(--t1)}

/* Mode indicator */
.tb-mode{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:var(--r3);font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.3px;border:1px solid var(--brd);flex-shrink:0}
.tb-mode.music{color:var(--accent);border-color:var(--accent);background:var(--accentD)}
.tb-mode.radio{color:var(--radio);border-color:var(--radio);background:var(--radioD)}
.tb-mode.tv{color:var(--tv);border-color:var(--tv);background:var(--tvD)}
.tb-mode .dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.tb-right{margin-left:auto;display:flex;gap:var(--sp-2);align-items:center;flex-shrink:0}
.tb-settings{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--t3)}
.tb-settings:hover{color:var(--t1);background:var(--hover)}
.tb-settings svg{width:15px;height:15px}

/* Tabs */
.tabs{display:flex;gap:var(--sp-2);padding:var(--sp-4) var(--sp-6) var(--sp-3);position:sticky;top:var(--topbar-h);z-index:var(--z-sticky);background:linear-gradient(to bottom,var(--bg2) 0%,rgba(19,19,19,.88) 65%,transparent 100%);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:var(--r3);font-size:var(--fs-xs);font-weight:600;color:var(--t2);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.04)}
.tab:hover{background:rgba(255,255,255,.07);color:var(--t1)}
.tab.on{background:var(--t1);color:var(--bg);border-color:var(--t1);font-weight:700}

/* ============================================================
   CARDS
============================================================ */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:var(--sp-5);padding:var(--sp-4) var(--sp-6)}
.card{background:var(--card);border-radius:var(--r2);padding:var(--sp-5);cursor:pointer;position:relative;transition:background var(--dur-m),transform var(--dur-m) var(--spring)}
.card:hover{background:var(--card-h);transform:translateY(-2px)}
.card:active{transform:scale(.97)}
.card-img{width:100%;aspect-ratio:1;border-radius:var(--r);background:var(--bg3);margin-bottom:var(--sp-4);overflow:hidden;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.card-img.round{border-radius:50%}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform var(--dur-s)}
.card:hover .card-img img{transform:scale(1.04)}
.card-play{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;opacity:0;transform:translateY(4px) scale(.9);transition:all var(--dur-m) var(--spring);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.card:hover .card-play{opacity:1;transform:translateY(0) scale(1)}
.card-play:hover{filter:brightness(1.08);transform:scale(1.06)!important}
.card-play svg{width:14px;height:14px;fill:var(--bg);margin-left:1px}
.card-title{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:var(--fs-2xs);color:var(--t3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.card-badge{position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:var(--r3);font-size:6.5px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);color:var(--accent)}
.card-tag{display:inline-block;margin-top:3px;padding:1px 5px;border-radius:3px;font-size:6.5px;font-weight:800;text-transform:uppercase;background:rgba(251,191,36,.06);color:var(--gold)}

/* ============================================================
   TRACK LIST
============================================================ */
.tl-head{display:grid;grid-template-columns:18px 6fr 4fr 3fr minmax(44px,1fr);gap:var(--sp-5);padding:var(--sp-2) var(--sp-6);font-size:var(--fs-2xs);color:var(--t3);font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--brd)}
.tl{padding:0 var(--sp-4) var(--sp-5)}
.tr{display:grid;grid-template-columns:18px 6fr 4fr 3fr minmax(44px,1fr);gap:var(--sp-5);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-sm);align-items:center;height:44px;cursor:pointer}
.tr:hover{background:var(--hover)}
.tr.on{background:var(--accentD)}
.tr.on .tr-name{color:var(--accent)}
.tr-idx{color:var(--t3);font-size:var(--fs-sm);text-align:center}
.tr:hover .idx-n{display:none}.tr:hover .idx-p{display:flex}
.idx-p{display:none;align-items:center;justify-content:center}
.idx-p svg{width:10px;height:10px;fill:var(--t1)}
.eq{display:flex;align-items:flex-end;gap:1.5px;height:10px}
.eq span{width:2px;background:var(--accent);border-radius:1px;animation:eq .6s ease-in-out infinite alternate}
.eq span:nth-child(1){height:40%;animation-delay:0s}.eq span:nth-child(2){height:100%;animation-delay:.1s}.eq span:nth-child(3){height:28%;animation-delay:.2s}
@keyframes eq{0%{height:15%}100%{height:100%}}
.tr-main{display:flex;align-items:center;gap:var(--sp-4);overflow:hidden}
.tr-thumb{width:32px;height:32px;border-radius:4px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:grid;place-items:center;position:relative}
.tr-thumb img{width:100%;height:100%;object-fit:cover}
.tr-info{overflow:hidden}
.tr-name{font-size:var(--fs-base);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--dur-f)}
.tr-artist{font-size:var(--fs-2xs);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;cursor:pointer;display:inline-block;max-width:100%}
.tr-artist:hover{color:var(--t1);text-decoration:underline}
.tr-album{font-size:var(--fs-xs);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tr-album:hover{color:var(--t1);text-decoration:underline}
.tr-src{font-size:var(--fs-2xs);color:var(--t3);font-weight:700;text-transform:uppercase}
.tr-end{display:flex;align-items:center;gap:var(--sp-2);justify-content:flex-end}
.tr-dur{font-size:var(--fs-xs);color:var(--t3);font-variant-numeric:tabular-nums}
.tr-like{opacity:0;color:var(--t2);width:20px;height:20px;display:grid;place-items:center;border-radius:50%}
.tr:hover .tr-like{opacity:1}
.tr-like.on{opacity:1;color:var(--accent)}
.tr-like:hover{background:var(--hover)}
.tr-like svg{width:11px;height:11px}
.tr-more{opacity:0;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--t3)}
.tr:hover .tr-more{opacity:1}
.tr-more:hover{color:var(--t1);background:var(--hover)}
.tr-more svg{width:11px;height:11px}

/* ============================================================
   SECTIONS / ACTIONS
============================================================ */
.sec-head{padding:var(--sp-7) var(--sp-6) 0;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}
.sec-head h2{font-size:var(--fs-lg);font-weight:800}
.sec-head .more{font-size:var(--fs-2xs);font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;padding:3px 8px;border-radius:var(--r3);white-space:nowrap}
.sec-head .more:hover{color:var(--t1);background:var(--hover)}
.sec-sub{font-size:var(--fs-xs);color:var(--t3);padding:2px var(--sp-6) 0}

.actions{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-6);flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--r3);font-size:var(--fs-xs);font-weight:700;transition:all var(--dur-f) var(--spring)}
.abtn svg{width:11px;height:11px}
.abtn.pri{background:var(--accent);color:var(--bg)}
.abtn.pri:hover{filter:brightness(1.1);transform:scale(1.02)}
.abtn.pri:active{transform:scale(.96)}
.abtn.sec{background:var(--bg4);color:var(--t2);border:1px solid var(--brd)}
.abtn.sec:hover{background:var(--bg5);color:var(--t1);border-color:var(--brd2)}
.abtn.icon{padding:8px;border-radius:50%}
.abtn.danger{color:var(--danger)}
.abtn.danger:hover{background:var(--dangerD)}

.load-more{display:flex;justify-content:center;padding:var(--sp-5)}
.load-more button{padding:8px 20px;border-radius:var(--r3);font-size:var(--fs-xs);font-weight:700;background:var(--bg4);color:var(--t2);border:1px solid var(--brd)}
.load-more button:hover{background:var(--bg5);color:var(--t1);border-color:var(--brd2)}
.load-more button:disabled{opacity:.3;pointer-events:none}

/* ============================================================
   LOADER / EMPTY / SKELETON
============================================================ */
.loader{display:flex;align-items:center;justify-content:center;padding:var(--sp-7);gap:5px}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:ldot .45s ease-in-out infinite alternate}
.ldot:nth-child(2){animation-delay:.07s}.ldot:nth-child(3){animation-delay:.14s}
@keyframes ldot{to{opacity:.15;transform:translateY(-3px)}}
.end-msg{text-align:center;padding:var(--sp-5);font-size:var(--fs-2xs);color:var(--t4)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px var(--sp-6);text-align:center}
.empty svg{width:36px;height:36px;color:var(--t4);margin-bottom:var(--sp-4);opacity:.35}
.empty h3{font-size:var(--fs-md);font-weight:800;margin-bottom:3px}
.empty p{font-size:var(--fs-xs);color:var(--t3);max-width:220px;line-height:1.5}
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shim .9s infinite;border-radius:4px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ============================================================
   PLAYER (footer)
============================================================ */
.player{background:var(--bg);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 var(--sp-5);border-top:1px solid var(--brd);z-index:100;padding-bottom:var(--safe-b)}
.p-left{display:flex;align-items:center;gap:var(--sp-4);min-width:0}
.p-art{width:46px;height:46px;border-radius:5px;background:var(--bg3);overflow:hidden;flex-shrink:0;cursor:pointer;transition:transform var(--dur-f);position:relative}
.p-art:hover{transform:scale(1.05)}
.p-art:hover::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.25)}
.p-art img{width:100%;height:100%;object-fit:cover}
.p-info{overflow:hidden;cursor:pointer}
.p-name{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.p-name:hover{text-decoration:underline}
.p-artist{font-size:var(--fs-2xs);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.p-artist:hover{color:var(--t1);text-decoration:underline}
.p-like{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--t2);flex-shrink:0}
.p-like:hover{color:var(--t1);background:var(--hover)}.p-like.on{color:var(--accent)}
.p-like svg{width:12px;height:12px}
.p-expand{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--t3);flex-shrink:0}
.p-expand:hover{color:var(--t1);background:var(--hover)}
.p-expand svg{width:12px;height:12px}

.p-center{display:flex;flex-direction:column;align-items:center;gap:3px;max-width:500px;margin:0 auto;width:100%}
.p-ctrls{display:flex;align-items:center;gap:var(--sp-6)}
.pc{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--t2);position:relative}
.pc:hover{color:var(--t1)}.pc.on{color:var(--accent)}
.pc.on::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:currentColor}
.pc svg{width:13px;height:13px}
.pc-main{width:28px;height:28px;border-radius:50%;background:var(--t1);display:grid;place-items:center;color:var(--bg);transition:transform var(--dur-f) var(--spring)}
.pc-main:hover{transform:scale(1.05)}.pc-main:active{transform:scale(.9)}
.pc-main svg{width:12px;height:12px}
.p-bar-w{display:flex;align-items:center;gap:var(--sp-3);width:100%}
.p-time{font-size:var(--fs-2xs);color:var(--t3);min-width:28px;font-variant-numeric:tabular-nums}
.p-time:last-child{text-align:right}
.p-bar{flex:1;height:3px;background:var(--bg4);border-radius:2px;cursor:pointer;position:relative;transition:height var(--dur-f)}
.p-bar:hover{height:5px}
.p-bar:hover .p-fill{background:var(--accent)}
.p-fill{height:100%;background:var(--t1);border-radius:2px;position:relative;transition:width .06s linear}
.p-bar:hover .p-fill::after{opacity:1}
.p-fill::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;background:var(--t1);border-radius:50%;opacity:0;transition:opacity var(--dur-f)}
.p-buffer{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.14);border-radius:2px}

.p-right{display:flex;align-items:center;gap:2px;justify-content:flex-end}
.pr{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--t3)}
.pr:hover{color:var(--t1);background:var(--hover)}.pr.on{color:var(--accent)}
.pr svg{width:12px;height:12px}
.vol-w{display:flex;align-items:center;gap:2px}
.vol-bar{width:56px;height:3px;background:var(--bg4);border-radius:2px;cursor:pointer;position:relative}
.vol-bar:hover{height:5px}
.vol-fill{height:100%;background:var(--t1);border-radius:2px;transition:width .05s}
.vol-bar:hover .vol-fill{background:var(--accent)}

/* ============================================================
   VISUALIZER
============================================================ */
.viz-wrap{width:100%;height:60px;position:relative;overflow:hidden;border-radius:var(--r);background:var(--bg)}
.viz-wrap canvas{width:100%;height:100%}

/* ============================================================
   RADIO
============================================================ */
.radio-card{background:var(--card);border-radius:var(--r2);padding:var(--sp-4);cursor:pointer;display:flex;align-items:center;gap:var(--sp-4);border:1px solid transparent;margin-bottom:var(--sp-2)}
.radio-card:hover{background:var(--card-h);border-color:var(--brd)}
.radio-card.on{border-color:var(--radio);background:var(--radioD)}
.rc-art{width:40px;height:40px;border-radius:var(--r);background:var(--bg3);flex-shrink:0;overflow:hidden;display:grid;place-items:center}
.rc-art img{width:100%;height:100%;object-fit:cover}
.rc-info{flex:1;overflow:hidden}
.rc-name{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{font-size:var(--fs-2xs);color:var(--t3);margin-top:1px}
.rc-live{width:6px;height:6px;border-radius:50%;background:var(--radio);flex-shrink:0;animation:pulse 1.2s infinite}
.fm-wrap{background:var(--bg3);border-radius:var(--r);padding:var(--sp-5);margin:var(--sp-4) var(--sp-6);border:1px solid var(--brd)}
.fm-row{display:flex;align-items:center;gap:var(--sp-4)}
.fm-slider{flex:1;-webkit-appearance:none;height:3px;background:linear-gradient(90deg,var(--radio),var(--accent));border-radius:2px;outline:none;cursor:pointer}
.fm-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);cursor:pointer;border:2px solid var(--bg)}
.fm-freq{font-size:var(--fs-base);font-weight:800;color:var(--accent);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}

/* ============================================================
   TV
============================================================ */
.tv-player{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;position:relative}
.tv-player video{width:100%;height:100%;object-fit:contain}
.tv-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:var(--fs-sm);pointer-events:none;background:rgba(0,0,0,.2)}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:var(--sp-3);padding:var(--sp-3) var(--sp-6)}
.tv-ch{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);cursor:pointer;background:var(--card);border:1px solid transparent}
.tv-ch:hover{background:var(--card-h);border-color:var(--brd)}
.tv-ch.on{border-color:var(--tv);background:var(--tvD)}
.tv-ch img{width:26px;height:26px;border-radius:4px;object-fit:cover;background:var(--bg4);flex-shrink:0}
.tv-ch .tv-name{font-size:var(--fs-xs);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tv-ch .tv-q{font-size:var(--fs-2xs);color:var(--t3);font-weight:700;flex-shrink:0}
.tv-subs{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);max-width:85%;text-align:center;padding:4px 12px;border-radius:5px;background:rgba(0,0,0,.78);color:#fff;font-size:var(--fs-lg);font-weight:500;pointer-events:none;display:none}
.tv-subs.show{display:block}

/* ============================================================
   FILTERS
============================================================ */
.filters{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-6);flex-wrap:wrap;align-items:center}
.filters select,.filters input[type="text"]{padding:5px 9px;background:var(--bg4);border:1px solid var(--brd);border-radius:var(--r3);font-size:var(--fs-2xs);color:var(--t1);min-width:84px;transition:border-color var(--dur-f)}
.filters select:focus,.filters input:focus{border-color:var(--accent)}

/* ============================================================
   AUDIO FX PANEL
============================================================ */
.fx-panel{position:fixed;right:0;top:0;bottom:0;width:290px;background:var(--bg2);border-left:1px solid var(--brd);z-index:var(--z-fx);transform:translateX(100%);transition:transform var(--dur-m) var(--ease);display:flex;flex-direction:column;overflow-y:auto}
.fx-panel.show{transform:translateX(0)}
.fx-head{padding:var(--sp-5) var(--sp-6);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--brd);flex-shrink:0}
.fx-head h3{font-size:var(--fs-md);font-weight:800}
.fx-close{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--t2)}
.fx-close:hover{color:var(--t1);background:var(--bg4)}
.fx-section{padding:var(--sp-5) var(--sp-6);border-bottom:1px solid var(--brd)}
.fx-label{font-size:var(--fs-2xs);font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:var(--sp-4)}
.fx-slider-row{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.fx-slider-row span{font-size:var(--fs-2xs);color:var(--t2);min-width:30px}
.fx-slider-row input[type="range"]{flex:1;-webkit-appearance:none;height:3px;background:var(--bg4);border-radius:2px;outline:none}
.fx-slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
.fx-presets{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.fx-preset{padding:4px 9px;border-radius:var(--r3);font-size:var(--fs-2xs);font-weight:700;background:var(--bg4);color:var(--t2);border:1px solid var(--brd)}
.fx-preset:hover{border-color:var(--accent);color:var(--accent)}
.fx-preset.on{background:var(--accentD);border-color:var(--accent);color:var(--accent)}

/* ============================================================
   SETTINGS MODAL
============================================================ */
.settings-wrap{position:fixed;inset:0;z-index:var(--z-settings);background:rgba(0,0,0,.85);display:none;place-items:center;backdrop-filter:blur(5px)}
.settings-wrap.show{display:grid}
.settings-box{background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--r2);width:92%;max-width:440px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--e3);animation:fUp .16s var(--ease)}
.settings-head{padding:var(--sp-6) var(--sp-6);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--brd);flex-shrink:0}
.settings-head h2{font-size:var(--fs-lg);font-weight:900}
.settings-body{flex:1;overflow-y:auto;padding:var(--sp-5) var(--sp-6)}
.s-section{margin-bottom:var(--sp-6)}
.s-section-title{font-size:var(--fs-xs);font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:var(--sp-3);padding-bottom:var(--sp-2);border-bottom:1px solid var(--brd)}
.s-row{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3) 0;gap:var(--sp-4)}
.s-row-label{font-size:var(--fs-sm);font-weight:500}
.s-row-sub{font-size:var(--fs-2xs);color:var(--t3)}
.s-row select,.s-row input[type="range"]{background:var(--bg4);border:1px solid var(--brd);border-radius:5px;padding:4px 7px;font-size:var(--fs-xs);color:var(--t1)}
.s-toggle{width:34px;height:19px;border-radius:10px;background:var(--bg4);border:1px solid var(--brd);position:relative;cursor:pointer;transition:background var(--dur-m);flex-shrink:0}
.s-toggle.on{background:var(--accent);border-color:var(--accent)}
.s-toggle::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--t1);transition:transform var(--dur-m)}
.s-toggle.on::after{transform:translateX(15px)}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3);margin-top:var(--sp-3)}
.theme-opt{aspect-ratio:1;border-radius:var(--r-sm);cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700}
.theme-opt:hover{border-color:var(--brd2)}
.theme-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ============================================================
   CONTEXT MENU / MODAL / TOAST
============================================================ */
.ctx{position:fixed;background:var(--bg3);border-radius:var(--r);padding:4px;min-width:170px;box-shadow:var(--e3),0 0 0 1px var(--brd);z-index:var(--z-ctx);display:none}
.ctx.show{display:block;animation:fUp .08s var(--ease)}
.ctx-i{padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);font-size:var(--fs-xs);color:var(--t2);display:flex;align-items:center;gap:var(--sp-3);cursor:pointer}
.ctx-i:hover{background:var(--hover);color:var(--t1)}
.ctx-i svg{width:12px;height:12px;opacity:.65;flex-shrink:0}
.ctx-i.danger{color:var(--danger)}
.ctx-i.danger:hover{background:var(--dangerD)}
.ctx-sep{height:1px;background:var(--brd);margin:3px 2px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:var(--z-modal);display:none;place-items:center;backdrop-filter:blur(3px)}
.modal-bg.show{display:grid}
.modal{background:var(--bg3);border-radius:var(--r2);padding:var(--sp-7);width:90%;max-width:380px;max-height:78vh;overflow-y:auto;box-shadow:var(--e3);animation:fUp .12s var(--ease)}
.modal h2{font-size:var(--fs-xl);font-weight:900;margin-bottom:var(--sp-5)}
.m-field{margin-bottom:var(--sp-4)}
.m-field label{display:block;font-size:var(--fs-2xs);font-weight:700;color:var(--t2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.2px}
.m-field input{width:100%;padding:8px 10px;background:var(--bg5);border:1px solid transparent;border-radius:var(--r);font-size:var(--fs-sm);transition:border-color var(--dur-f)}
.m-field input:focus{border-color:var(--accent)}
.m-btns{display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-6)}
.m-btn{padding:8px 18px;border-radius:var(--r3);font-size:var(--fs-sm);font-weight:700}
.m-btn.pri{background:var(--accent);color:var(--bg)}.m-btn.pri:hover{filter:brightness(1.1)}
.m-btn.ghost{color:var(--t2)}.m-btn.ghost:hover{color:var(--t1)}

.toasts{position:fixed;bottom:calc(var(--player-h) + 10px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:var(--z-toast);display:flex;flex-direction:column;gap:var(--sp-2);align-items:center;pointer-events:none}
.toast{padding:7px 16px;background:var(--bg3);color:var(--t1);border:1px solid var(--brd2);border-radius:var(--r);font-size:var(--fs-xs);font-weight:600;box-shadow:var(--e2);animation:fUp .15s var(--spring);pointer-events:auto}
.toast.ok{border-color:var(--accent);color:var(--accent)}
.toast.err{border-color:var(--danger);color:var(--danger)}

/* ============================================================
   DESKTOP "NOW PLAYING" FULLSCREEN OVERLAY (NEW)
============================================================ */
.npo{position:fixed;inset:0;z-index:var(--z-npo);background:var(--bg1);display:none;flex-direction:column;opacity:0;transition:opacity var(--dur-m) var(--ease)}
.npo.show{display:flex;opacity:1}
.npo-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.npo-bg img{width:100%;height:100%;object-fit:cover;filter:blur(70px) saturate(1.5) brightness(.55);transform:scale(1.3)}
.npo-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(10,10,10,.75) 55%,var(--bg1) 100%)}
.npo-head{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:var(--sp-7) var(--sp-8);flex-shrink:0}
.npo-close{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.32);display:grid;place-items:center;color:var(--t1)}
.npo-close:hover{background:rgba(0,0,0,.55)}
.npo-close svg{width:15px;height:15px}
.npo-title{font-size:var(--fs-xs);font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.npo-actions{display:flex;gap:var(--sp-2)}
.npo-body{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1fr;overflow:hidden;padding:0 var(--sp-8) var(--sp-6);min-height:0}
.npo-main{display:flex;flex-direction:column;align-items:center;width:100%;max-width:440px;margin:0 auto;overflow-y:auto;padding-bottom:var(--sp-6)}
.npo-art{width:100%;max-width:320px;aspect-ratio:1;border-radius:var(--r2);overflow:hidden;box-shadow:var(--e4);margin-bottom:var(--sp-7);flex-shrink:0}
.npo-art img{width:100%;height:100%;object-fit:cover}
.npo-info{text-align:center;width:100%}
.npo-name{font-size:var(--fs-2xl);font-weight:900;letter-spacing:-.01em;line-height:1.15}
.npo-artist{font-size:var(--fs-md);color:var(--t2);margin-top:4px;cursor:pointer;display:inline-block}
.npo-artist:hover{color:var(--t1);text-decoration:underline}
.npo-live-badge{font-size:var(--fs-xs);font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.npo-controls{width:100%;max-width:420px;margin:var(--sp-7) auto 0;flex-shrink:0}
.npo-side{position:relative;z-index:2;width:360px;background:rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid var(--brd);display:none;flex-direction:column;flex-shrink:0}
.npo-side-head{display:flex;gap:2px;padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--brd);flex-shrink:0}
.npo-side-tab{padding:5px 10px;border-radius:var(--r3);font-size:var(--fs-xs);font-weight:700;color:var(--t3)}
.npo-side-tab:hover{color:var(--t2)}
.npo-side-tab.on{background:var(--bg4);color:var(--t1)}
.npo-side-body{flex:1;overflow-y:auto;padding:var(--sp-3)}
@media(min-width:980px){
.npo-body{grid-template-columns:1fr 360px;padding-bottom:0}
.npo-side{display:flex}
.npo-main{padding-top:var(--sp-6)}
}

/* ============================================================
   RIGHT PANEL (desktop) — incl. new Related tab
============================================================ */
.rp{display:none}
@media(min-width:1200px){
.layout{grid-template-columns:var(--sb-w) 1fr 250px}
.rp{display:flex;flex-direction:column;background:var(--bg2);border-radius:var(--r);overflow:hidden;border:1px solid var(--brd)}
.rp-head{padding:var(--sp-4) var(--sp-4);display:flex;gap:2px;border-bottom:1px solid var(--brd);flex-wrap:wrap}
.rp-tab{padding:4px 8px;border-radius:var(--r3);font-size:var(--fs-2xs);font-weight:700;color:var(--t3)}
.rp-tab:hover{color:var(--t2)}.rp-tab.on{background:var(--bg4);color:var(--t1)}
.rp-body{flex:1;overflow-y:auto;padding:var(--sp-2)}
}

/* Related list (used inside rp-body + mobile related section) */
.related-reason{font-size:var(--fs-2xs);color:var(--t4);padding:var(--sp-4) var(--sp-4) var(--sp-2);text-transform:uppercase;letter-spacing:.3px;font-weight:700}
.related-item{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);cursor:pointer}
.related-item:hover{background:var(--hover)}
.related-thumb{width:34px;height:34px;border-radius:4px;background:var(--bg3);flex-shrink:0;overflow:hidden}
.related-thumb img{width:100%;height:100%;object-fit:cover}
.related-info{flex:1;overflow:hidden}
.related-name{font-size:var(--fs-xs);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.related-artist{font-size:var(--fs-2xs);color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.related-add{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--t3);opacity:0;flex-shrink:0}
.related-item:hover .related-add{opacity:1}
.related-add:hover{color:var(--accent);background:var(--accentD)}
.related-add svg{width:11px;height:11px}

/* ============================================================
   QUEUE (drag / reorder ready) — used in rp-body Queue tab
============================================================ */
.q-section-label{font-size:var(--fs-2xs);font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;padding:var(--sp-4) var(--sp-4) var(--sp-2);display:flex;align-items:center;justify-content:space-between}
.q-section-label button{font-size:var(--fs-2xs);font-weight:600;color:var(--t3)}
.q-section-label button:hover{color:var(--t1)}
.q-from-badge{font-size:var(--fs-2xs);color:var(--t4);padding:0 var(--sp-4) var(--sp-3)}
.queue-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);cursor:pointer}
.queue-item:hover{background:var(--hover)}
.queue-item.on{background:var(--accentD)}
.queue-item.dragging{opacity:.35}
.queue-item.drag-over{box-shadow:inset 0 2px 0 var(--accent)}
.q-drag{width:11px;height:16px;color:var(--t4);opacity:0;flex-shrink:0;cursor:grab;display:flex;align-items:center;justify-content:center}
.queue-item:hover .q-drag{opacity:1}
.q-drag svg{width:9px;height:14px}
.q-thumb{width:26px;height:26px;border-radius:4px;background:var(--bg3);flex-shrink:0;overflow:hidden}
.q-thumb img{width:100%;height:100%;object-fit:cover}
.q-info{flex:1;overflow:hidden}
.q-name{font-size:var(--fs-xs);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-artist{font-size:var(--fs-2xs);color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-dur{font-size:var(--fs-2xs);color:var(--t4);flex-shrink:0}
.q-actions{display:flex;align-items:center;flex-shrink:0}
.q-actions button{width:16px;height:16px;display:grid;place-items:center;color:var(--t4);opacity:.6}
.q-actions button:hover{color:var(--t1);opacity:1}

/* ============================================================
   SEARCH LANDING / BROWSE / RECENT CHIPS (NEW)
============================================================ */
.recent-chips{display:flex;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-3) var(--sp-6)}
.recent-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r3);background:var(--bg4);color:var(--t2);font-size:var(--fs-2xs);font-weight:600;cursor:pointer;border:1px solid var(--brd)}
.recent-chip:hover{background:var(--bg5);color:var(--t1)}
.recent-chip .rc-x{width:12px;height:12px;display:grid;place-items:center;opacity:.55;border-radius:50%}
.recent-chip .rc-x:hover{opacity:1;background:rgba(255,255,255,.12)}
.recent-chip .rc-x svg{width:7px;height:7px}
.browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:var(--sp-4);padding:var(--sp-3) var(--sp-6)}
.browse-tile{position:relative;height:76px;border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;align-items:flex-start;padding:var(--sp-4);transition:transform var(--dur-f) var(--spring)}
.browse-tile:hover{transform:translateY(-2px) scale(1.015)}
.browse-tile .bt-emoji{font-size:28px;position:absolute;right:2px;bottom:-6px;opacity:.75;transform:rotate(16deg)}
.browse-tile .bt-label{font-size:var(--fs-base);font-weight:800;color:#fff;position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.35);line-height:1.25;max-width:75%}

/* ============================================================
   MOBILE
============================================================ */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--brd);z-index:var(--z-mobnav);padding:2px 0 var(--safe-b)}
.mob-nav-in{display:flex;justify-content:space-around;align-items:center;height:var(--nav-h)}
.mob-i{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;color:var(--t3);font-size:var(--fs-2xs);font-weight:600;min-width:40px}
.mob-i svg{width:17px;height:17px}.mob-i.on{color:var(--accent)}
.mob-player{display:none;position:fixed;left:6px;right:6px;z-index:var(--z-mobplayer);background:var(--bg3);border-radius:var(--r2);padding:6px 9px;box-shadow:var(--e2);border:1px solid var(--brd);overflow:hidden}
.mob-player-in{display:flex;align-items:center;gap:var(--sp-3)}
.mob-player .mp-art{width:32px;height:32px;border-radius:4px;overflow:hidden;flex-shrink:0;background:var(--bg4)}
.mob-player .mp-art img{width:100%;height:100%;object-fit:cover}
.mob-player .mp-info{flex:1;overflow:hidden}
.mob-player .mp-name{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mob-player .mp-sub{font-size:var(--fs-2xs);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mob-player .mp-ctrls{display:flex;gap:0}
.mob-player .mp-btn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--t1)}
.mob-player .mp-btn svg{width:14px;height:14px}
.mob-player .mp-prog{position:absolute;bottom:0;left:8px;right:8px;height:2px;background:var(--bg4);border-radius:1px;overflow:hidden}
.mob-player .mp-fill{height:100%;background:var(--accent);border-radius:1px}
.mfp{display:none;position:fixed;inset:0;z-index:var(--z-mfp);background:var(--bg1);flex-direction:column;padding:var(--safe-t) var(--sp-6) var(--safe-b);overflow-y:auto}
.mfp.show{display:flex}

/* ============================================================
   RESPONSIVE
============================================================ */
@media(max-width:900px){:root{--sb-w:0px}.sb{display:none}.layout{grid-template-columns:1fr}}
@media(max-width:640px){
:root{--player-h:0px}.app{grid-template-rows:1fr}.player{display:none}
.layout{padding:0;padding-top:var(--safe-t)}.center{border-radius:0;border:none}
.mob-nav{display:block}.mob-player{display:block;bottom:calc(var(--nav-h) + var(--safe-b) + 5px)}
.toasts{bottom:calc(var(--nav-h) + var(--safe-b) + 48px)}
.center{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 48px)}
.topbar{padding:0 var(--sp-4)}.tb-back,.tb-fwd{display:none}.search-w{max-width:100%}
.tl-head,.tr{grid-template-columns:18px 1fr minmax(34px,auto)}
.tr-album,.tr-src,.tl-head span:nth-child(3),.tl-head span:nth-child(4){display:none}
.tl-head{padding:var(--sp-2) var(--sp-5)}
.card-grid,.tv-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:var(--sp-3);padding:var(--sp-3) var(--sp-5)}
.tabs{padding:var(--sp-3) var(--sp-5);gap:3px;top:34px}
.actions{padding:var(--sp-3) var(--sp-5)}.sec-head{padding:var(--sp-6) var(--sp-5) 0}.sec-sub{padding:1px var(--sp-5) 0}
.tr{height:40px;padding:var(--sp-2) var(--sp-3)}.tr-thumb{width:28px;height:28px}.tr-like{opacity:1}
.filters{padding:var(--sp-2) var(--sp-5)}
.fx-panel{width:100%}
.browse-grid{padding:var(--sp-2) var(--sp-5)}
.recent-chips{padding:var(--sp-2) var(--sp-5)}
}
@media(max-width:380px){.card-grid,.tv-grid{grid-template-columns:repeat(2,1fr);gap:var(--sp-3);padding:var(--sp-3) var(--sp-4)}}
@media(hover:none){.card:hover{transform:none}.card:active{transform:scale(.97)}.card-play{opacity:1;transform:translateY(0) scale(1)}.tr-like{opacity:1}.tr-more{opacity:1}}

/* ============================================================
   PAGE TRANSITION
============================================================ */
#page{animation:pageIn .14s var(--out)}
@keyframes pageIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="layout">

<!-- ============ SIDEBAR ============ -->
<nav class="sb">
<div class="sb-nav">
<div class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="url(#lg)" stroke-width="2.5"/><circle cx="20" cy="20" r="11" stroke="url(#lg)" stroke-width="2"/><circle cx="20" cy="20" r="4.5" fill="url(#lg)"/><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#1ed760"/><stop offset="1" stop-color="#a3e635"/></linearGradient></defs></svg><span>Ringify</span></div>
<button class="nav-i on" data-v="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20a1 1 0 0 0 1 1h4v-7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7h4a1 1 0 0 0 1-1V7.577l-7.5-4.33z"/></svg><span>Home</span></button>
<button class="nav-i" data-v="search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="10.5" cy="10.5" r="7"/><path d="m20 20-4.5-4.5"/></svg><span>Search</span></button>
<button class="nav-i" data-v="artists" aria-label="Artists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Artists</span></button>
<button class="nav-i" data-v="radio" aria-label="Radio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2a5.5 5.5 0 0 1 0-8.4"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.2 7.8a5.5 5.5 0 0 1 0 8.4"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/></svg><span>Radio</span></button>
<button class="nav-i" data-v="tv" aria-label="Live TV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg><span>TV</span></button>
</div>
<div class="sb-lib">
<div class="lib-head"><span>Library</span><button class="lib-add" id="btnNewPl" aria-label="Create playlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
<div class="lib-list" id="libList"></div>
</div>
</nav>

<!-- ============ CENTER ============ -->
<main class="center" id="center">
<div class="cgrad" id="cgrad"></div>
<div class="topbar" id="topbar">
<button class="tb-back off" id="btnBack" aria-label="Go back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
<button class="tb-fwd off" id="btnFwd" aria-label="Go forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
<div class="search-w">
<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="10.5" cy="10.5" r="7"/><path d="m20 20-4.5-4.5"/></svg>
<input id="inp" placeholder="Search songs, artists, albums..." autocomplete="off" spellcheck="false" aria-label="Search">
<button class="search-clear" id="searchClear" aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<div class="sug" id="sug"></div>
</div>
<div class="tb-mode music" id="tbMode"><span class="dot"></span>Music</div>
<div class="tb-right">
<button class="tb-settings" id="btnFx" title="Audio FX" aria-label="Audio effects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 20V4"/></svg></button>
<button class="tb-settings" id="btnSettings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>
</div>
<div id="page"></div>
<div id="sentinel" style="height:1px"></div>
</main>

<!-- ============ RIGHT PANEL (desktop) ============ -->
<aside class="rp" id="rp">
<div class="rp-head">
<button class="rp-tab on" data-t="queue">Queue</button>
<button class="rp-tab" data-t="related">Related</button>
<button class="rp-tab" data-t="lyrics">Lyrics</button>
<button class="rp-tab" data-t="viz">Viz</button>
<button class="rp-tab" data-t="np">NP</button>
</div>
<div class="rp-body" id="rpBody"></div>
</aside>
</div>

<!-- ============ PLAYER (footer) ============ -->
<footer class="player" id="player">
<div class="p-left">
<div class="p-art" id="pArt" role="button" aria-label="Open now playing"></div>
<div class="p-info" id="pInfo" role="button" aria-label="Open now playing">
<div class="p-name" id="pName">—</div>
<div class="p-artist" id="pArtist">—</div>
</div>
<button class="p-like" id="pLike" aria-label="Like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
</div>

<div class="p-center">
<div class="p-ctrls">
<button class="pc" id="bShuf" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
<button class="pc" id="bPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
<button class="pc-main" id="bPlay" aria-label="Play/Pause"><svg viewBox="0 0 24 24" fill="currentColor" id="iPlay"><path d="M8 5v14l11-7z"/></svg></button>
<button class="pc" id="bNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg></button>
<button class="pc" id="bRep" aria-label="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
</div>
<div class="p-bar-w">
<span class="p-time" id="tCur">0:00</span>
<div class="p-bar" id="pBar"><div class="p-buffer" id="pBuf" style="width:0%"></div><div class="p-fill" id="pFill"></div></div>
<span class="p-time" id="tDur">0:00</span>
</div>
</div>

<div class="p-right">
<button class="p-expand" id="btnNP" title="Now Playing view" aria-label="Expand now playing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg></button>
<button class="pr" id="btnSpeed" title="Speed" aria-label="Playback speed">1x</button>
<button class="pr" id="btnSleep" title="Sleep timer" aria-label="Sleep timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
<button class="pr" id="btnVol" aria-label="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="vIco"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
<div class="vol-w"><div class="vol-bar" id="vBar" role="slider" aria-label="Volume"><div class="vol-fill" id="vFill" style="width:80%"></div></div></div>
</div>
</footer>
</div>

<!-- ============ MOBILE ============ -->
<div class="mob-player" id="mobPlayer"><div class="mob-player-in">
<div class="mp-art" id="mpArt"></div>
<div class="mp-info"><div class="mp-name" id="mpName">—</div><div class="mp-sub" id="mpSub">—</div></div>
<div class="mp-ctrls" id="mpCtrls">
<button class="mp-btn" id="mpPrevBtn" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
<button class="mp-btn" id="mpPlay" aria-label="Play/Pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
<button class="mp-btn" id="mpNextBtn" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg></button>
</div>
</div><div class="mp-prog"><div class="mp-fill" id="mpFill"></div></div></div>

// ===== LRU CACHE =====
class LRU{
    constructor(m=35){this.m=m;this.c=new Map()}
    get(k){if(!this.c.has(k))return;const v=this.c.get(k);this.c.delete(k);this.c.set(k,v);return v}
    set(k,v){if(this.c.has(k))this.c.delete(k);else if(this.c.size>=this.m)this.c.delete(this.c.keys().next().value);this.c.set(k,v)}
    has(k){return this.c.has(k)}
    del(k){this.c.delete(k)}
    clear(){this.c.clear()}
    get size(){return this.c.size}
}

function SS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

const S={

    // Search
    query:'',page:{s:1,p:1,alb:1,art:1},
    hasMore:{s:true,p:true,alb:true,art:true},
    loading:false,seen:new Set(),
    res:{songs:[],pls:[],albums:[],artists:[]},
    // Abort / race
    _ac:null,_reqId:0,
    // Caches
    _lyr:new LRU(40),_alb:new LRU(20),_art:new LRU(20),_stream:new LRU(60),_sugC:new LRU(15),_rel:new LRU(30),
    // Lyrics
    lyrics:[],lyrIdx:-1,lyrSrc:'',lyrBusy:false,
    // Related songs (sidebar / NPO)
    related:[],relatedBusy:false,relatedFor:null,
    // Artist pagination
    _artPages:null,
    // Audio pipeline
    audioCtx:null,srcNode:null,eqNodes:[],compNode:null,pannerNode:null,gainNode:null,analyser:null,
    monoSplit:null,monoMerge:null,monoGainL:null,monoGainR:null,
    _pipWin:null,
    // Settings
    settings:LS('r_settings',null)||{...DEFAULTS},
    // Sleep
    sleepTimer:null,sleepEnd:0,
    // Recording (radio)
    recording:false,mediaRec:null,recChunks:[],
};

// Merge missing defaults (handles upgrades from older saved settings)
Object.keys(DEFAULTS).forEach(k=>{if(!(k in S.settings))S.settings[k]=DEFAULTS[k]});
// Smart first-run default for reduced motion
if(!LS('r_settings',null)&&window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)S.settings.reducedMotion=true;

S.vol=S.settings.volume??.8;

// ===== ABORT / RACE =====
function newReq(){S._reqId++;if(S._ac)S._ac.abort();S._ac=new AbortController();return S._reqId}
function isStale(id){return id!==S._reqId}

// ===== GENERIC UTILITIES =====
function rnd(){return Math.random().toString(36).slice(2,8)}
function fmt(s){if(!s||isNaN(s))return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h?h+':'+(m+'').padStart(2,'0')+':'+(ss+'').padStart(2,'0'):m+':'+(ss+'').padStart(2,'0')}
function esc(t){if(!t)return'';const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function dec(h){if(!h)return'';const t=document.createElement('textarea');t.innerHTML=h;return t.value}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function normKey(t,a){return(t+'|'+a).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,40)}
function fmtK(n){if(!n)return'';n=parseInt(n)||0;if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'K';return n+''}

function toast(msg,ms=1800,type=''){
    const el=document.createElement('div');
    el.className='toast'+(type?' '+type:'');
    el.textContent=msg;
    $('toasts').appendChild(el);
    setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .15s';setTimeout(()=>el.remove(),160)},ms);
}

// ===== HISTORY HELPERS (music / radio / tv share the same pattern) =====
function addHistory(list,item,max=50){
    if(!list.length||list[0].id!==item.id){
        list.unshift({...item,playedAt:Date.now()});
        if(list.length>max)list.length=max;
    }
}

// ===== RECENT SEARCHES =====
function addRecentSearch(q){
    q=(q||'').trim();if(q.length<2)return;
    S.recentSearches=S.recentSearches.filter(x=>x.toLowerCase()!==q.toLowerCase());
    S.recentSearches.unshift(q);
    if(S.recentSearches.length>12)S.recentSearches.length=12;
    SS('r_recent_search',S.recentSearches);
}
function removeRecentSearch(q){S.recentSearches=S.recentSearches.filter(x=>x!==q);SS('r_recent_search',S.recentSearches);if(typeof renderSearchLanding==='function'&&S.view==='search'&&!S.query)renderSearchLanding()}
function clearRecentSearches(){S.recentSearches=[];SS('r_recent_search',[]);if(typeof renderSearchLanding==='function')renderSearchLanding()}

// ===== GRADIENT WASH =====
function setGrad(title,type){
    const el=$('cgrad');if(!el)return;
    if(!title){el.style.setProperty('--grad-top','rgba(18,22,35,.45)');el.style.setProperty('--grad-mid','rgba(12,15,25,.25)');return}
    const h=((title.charCodeAt(0)||0)*7+(title.charCodeAt(1)||0)*11)%360;
    const presets={song:[26,16],artist:[30,18],album:[24,15],playlist:[32,17],radio:[22,14],tv:[20,13]};
    const[sat,lit]=presets[type]||presets.song;
    el.style.setProperty('--grad-top',`hsla(${h},${sat}%,${lit}%,.55)`);
    el.style.setProperty('--grad-mid',`hsla(${h},${sat-6}%,${lit-3}%,.3)`);
}

// ===== VIEW NAVIGATION (back/forward history stack) =====
function pushV(v){S.vIdx++;S.viewHist.length=S.vIdx;S.viewHist.push(v);if(S.viewHist.length>20){S.viewHist.shift();S.vIdx--}updNavBtns()}
function goBack(){if(S.vIdx>0){S.vIdx--;restoreV(S.viewHist[S.vIdx]);updNavBtns()}}
function goFwd(){if(S.vIdx<S.viewHist.length-1){S.vIdx++;restoreV(S.viewHist[S.vIdx]);updNavBtns()}}
function updNavBtns(){$('btnBack')?.classList.toggle('off',S.vIdx<=0);$('btnFwd')?.classList.toggle('off',S.vIdx>=S.viewHist.length-1)}
function restoreV(v){/* fully implemented in Part 4 */}

// ===== FETCH HELPER =====
async function rfetch(url,opts={}){
    const{timeout=6000,retries=1,signal}=opts;
    for(let i=0;i<=retries;i++){
        try{
            const c=new AbortController();
            const sig=signal||c.signal;
            const t=setTimeout(()=>c.abort(),timeout);
            const r=await fetch(url,{signal:sig});
            clearTimeout(t);
            if(!r.ok){if(i<retries){await new Promise(r=>setTimeout(r,300*(i+1)));continue}return null}
            return await r.json();
        }catch(e){if(e.name==='AbortError')return null;if(i<retries){await new Promise(r=>setTimeout(r,300*(i+1)));continue}return null}
    }
    return null;
}

// ===== SESSION PERSISTENCE =====
function saveSession(){
    SS('r_session',{
        cur:S.cur,idx:S.idx,time:au.currentTime||0,
        queue:S.queue.slice(0,60),queueSource:S.queueSource,manualQueue:S.manualQueue.slice(0,30),
        songs:S.songs.slice(0,60),
        shuffle:S.shuffle,repeat:S.repeat,vol:S.vol,mode:S.mode,ts:Date.now()
    });
}
function restoreSess(){
    const s=LS('r_session',null);
    if(!s||!s.cur||Date.now()-s.ts>24*3600*1000)return false;
    S.cur=s.cur;S.idx=s.idx||0;S.queue=s.queue||[];S.queueSource=s.queueSource||null;S.manualQueue=s.manualQueue||[];
    S.songs=s.songs||[];S.shuffle=!!s.shuffle;S.repeat=s.repeat||'none';S.vol=s.vol??.8;S.mode=s.mode||'idle';
    if(S.cur?.url&&S.cur.url!=='__enc__'&&S.mode==='music'){au.src=S.cur.url;au.currentTime=s.time||0;au.volume=S.vol}
    return true;
}
let _saveT=null;
function qSave(){clearTimeout(_saveT);_saveT=setTimeout(saveSession,1500)}

document.addEventListener('visibilitychange',()=>{if(document.hidden)saveSession()});
window.addEventListener('beforeunload',()=>{
    saveSession();
    SS('r_liked',S.liked);SS('r_pls',S.pls);SS('r_hist',S.history.slice(0,50));
    SS('r_hist_radio',S.radioHistory.slice(0,30));SS('r_hist_tv',S.tvHistory.slice(0,30));
    SS('r_fav_radio',S.favRadios);SS('r_fav_tv',S.favTV);SS('r_settings',S.settings);
    SS('r_recent_search',S.recentSearches);
});

const inp=$('inp'),searchClearBtn=$('searchClear');

inp?.addEventListener('input',updateSearchClear);
searchClearBtn?.addEventListener('click',()=>{

/* ╔══════════════════════════════════════════════════════════════╗
   ║ SHARED AUDIO PIPELINE (Web Audio API)                       ║
   ║ src(s) → EQ×5 → [Compressor] → [Mono downmix] → Panner →    ║
   ║ Gain → Analyser → Destination                               ║
   ║ Reused by Music/Radio (<audio>) AND TV (<video>) via        ║
   ║ attachMediaSource() so both share one processing graph.     ║
   ╚══════════════════════════════════════════════════════════════╝ */

const EQ_FREQS=[60,230,910,3600,14000];
const EQ_PRESETS={
    flat:[0,0,0,0,0],
    bass_boost:[6,4,0,-1,-2],
    vocal:[-2,0,3,4,2],
    rock:[4,2,-1,3,4],
    electronic:[4,3,0,2,5],
    acoustic:[2,1,0,2,3],
    podcast:[-2,0,4,3,0],
    night_mode:[-3,0,2,3,1],
};

function initAudioPipeline(){
    if(S.audioCtx)return;
    try{
        S.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        S.srcNode=S.audioCtx.createMediaElementSource(au);
        au._waSrc=S.srcNode;
        buildFXChain();
        S.srcNode.connect(S.eqNodes[0]);
    }catch(e){console.warn('Web Audio init failed:',e)}
}

function buildFXChain(){
    const ctx=S.audioCtx;

    // 5-band EQ
    S.eqNodes=EQ_FREQS.map((freq,i)=>{
        const f=ctx.createBiquadFilter();
        f.type=i===0?'lowshelf':i===EQ_FREQS.length-1?'highshelf':'peaking';
        f.frequency.value=freq;f.gain.value=S.settings.eq[i]||0;f.Q.value=1.4;
        return f;
    });
    for(let i=0;i<S.eqNodes.length-1;i++)S.eqNodes[i].connect(S.eqNodes[i+1]);

    // Compressor
    S.compNode=ctx.createDynamicsCompressor();
    S.compNode.threshold.value=-24;S.compNode.knee.value=30;S.compNode.ratio.value=4;
    S.compNode.attack.value=.003;S.compNode.release.value=.25;

    // Mono downmix (sum L+R equally into both channels)
    S.monoSplit=ctx.createChannelSplitter(2);
    S.monoGainL=ctx.createGain();S.monoGainL.gain.value=.5;
    S.monoGainR=ctx.createGain();S.monoGainR.gain.value=.5;
    S.monoMerge=ctx.createChannelMerger(2);
    S.monoSplit.connect(S.monoGainL,0);S.monoSplit.connect(S.monoGainR,1);
    S.monoGainL.connect(S.monoMerge,0,0);S.monoGainL.connect(S.monoMerge,0,1);
    S.monoGainR.connect(S.monoMerge,0,0);S.monoGainR.connect(S.monoMerge,0,1);

    // Stereo panner (real balance control)
    S.pannerNode=ctx.createStereoPanner();
    S.pannerNode.pan.value=clamp((S.settings.balance||0)/100,-1,1);

    // Gain + Analyser
    S.gainNode=ctx.createGain();S.gainNode.gain.value=1;
    S.analyser=ctx.createAnalyser();S.analyser.fftSize=256;S.analyser.smoothingTimeConstant=.75;

    relinkPostChain();
}

// Rebuild everything after the last EQ node (compressor/mono toggles need this)
function relinkPostChain(){
    if(!S.audioCtx)return;
    const lastEQ=S.eqNodes[S.eqNodes.length-1];
    try{lastEQ.disconnect()}catch{}
    try{S.compNode.disconnect()}catch{}
    try{S.monoSplit.disconnect()}catch{}
    try{S.monoMerge.disconnect()}catch{}
    try{S.pannerNode.disconnect()}catch{}
    try{S.gainNode.disconnect()}catch{}
    try{S.analyser.disconnect()}catch{}

    let node=lastEQ;
    if(S.settings.compressor){node.connect(S.compNode);node=S.compNode}
    if(S.settings.mono){node.connect(S.monoSplit);node=S.monoMerge}
    else node.connect(S.pannerNode);
    if(S.settings.mono)node.connect(S.pannerNode);
    S.pannerNode.connect(S.gainNode);
    S.gainNode.connect(S.analyser);
    S.analyser.connect(S.audioCtx.destination);
}

// Attach ANY <audio>/<video> element into the shared graph (used by TV in Part 7)
function attachMediaSource(mediaEl){
    if(!mediaEl)return null;
    if(!S.audioCtx)initAudioPipeline();
    if(mediaEl._waSrc)return mediaEl._waSrc;
    try{
        mediaEl.crossOrigin=mediaEl.crossOrigin||'anonymous';
        const src=S.audioCtx.createMediaElementSource(mediaEl);
        src.connect(S.eqNodes[0]);
        mediaEl._waSrc=src;
        return src;
    }catch(e){console.warn('attachMediaSource failed (likely CORS):',e.message);return null}
}

function resumeAudio(){if(S.audioCtx?.state==='suspended')S.audioCtx.resume().catch(()=>{})}

// ===== EQ CONTROL =====
function setEQ(band,value){
    S.settings.eq[band]=value;
    if(S.eqNodes[band])S.eqNodes[band].gain.value=value;
    S.settings.eqPreset='custom';
    SS('r_settings',S.settings);
}
function setEQPreset(name){
    const preset=EQ_PRESETS[name];if(!preset)return;
    S.settings.eqPreset=name;
    preset.forEach((v,i)=>{S.settings.eq[i]=v;if(S.eqNodes[i])S.eqNodes[i].gain.value=v});
    SS('r_settings',S.settings);
    if(typeof renderFXPanel==='function')renderFXPanel();
}
function toggleCompressor(){
    S.settings.compressor=!S.settings.compressor;
    relinkPostChain();SS('r_settings',S.settings);
    toast(S.settings.compressor?'Compressor ON':'Compressor OFF');
    if(typeof renderFXPanel==='function')renderFXPanel();
}
function toggleMono(){
    S.settings.mono=!S.settings.mono;
    relinkPostChain();SS('r_settings',S.settings);
    toast(S.settings.mono?'Mono ON':'Mono OFF');
    if(typeof renderFXPanel==='function')renderFXPanel();
}
function setBalance(v){
    S.settings.balance=v;
    if(S.pannerNode)S.pannerNode.pan.value=clamp(v/100,-1,1);
    SS('r_settings',S.settings);
}

// ===== SPEED CONTROL =====
const SPEEDS=[0.5,0.75,1,1.25,1.5,1.75,2];
let speedIdx=2;
function setSpeed(s){
    S.speed=s;speedIdx=Math.max(0,SPEEDS.indexOf(s));
    S.settings.speed=s;au.playbackRate=s;
    $('btnSpeed').textContent=s===1?'1x':s+'x';
    $('btnSpeed').classList.toggle('on',s!==1);
    SS('r_settings',S.settings);
    toast(`Speed: ${s}x`);
}
function cycleSpeed(){speedIdx=(speedIdx+1)%SPEEDS.length;setSpeed(SPEEDS[speedIdx])}
function showSpeedMenu(){
    $('mBox').innerHTML=`<h2>Playback Speed</h2>
${SPEEDS.map(s=>`<button class="abtn sec" style="width:100%;justify-content:center;margin-bottom:4px;${s===S.speed?'color:var(--accent);border-color:var(--accent)':''}" onclick="setSpeed(${s});closeModal()">${s}x${s===1?' (Normal)':''}</button>`).join('')}
<div class="m-btns"><button class="m-btn ghost" onclick="closeModal()">Close</button></div>`;
    $('mBg').classList.add('show');
}
$('btnSpeed').addEventListener('click',cycleSpeed);
$('btnSpeed').addEventListener('contextmenu',e=>{e.preventDefault();showSpeedMenu()});

// ===== SLEEP TIMER =====
function setSleep(minutes){
    clearSleep();S.sleepAtTrackEnd=false;
    if(!minutes)return;
    S.sleepEnd=Date.now()+minutes*60000;
    S.sleepTimer=setTimeout(()=>{
        au.pause();S.playing=false;if(typeof updIcons==='function')updIcons();
        toast('Sleep timer — paused','','ok');clearSleep();
    },minutes*60000);
    toast(`Sleep in ${minutes} min`,'','ok');
}
function clearSleep(){if(S.sleepTimer){clearTimeout(S.sleepTimer);S.sleepTimer=null}S.sleepEnd=0}
function setSleepAtTrackEnd(){clearSleep();S.sleepAtTrackEnd=true;toast('Will stop after this song','','ok')}

// ===== VISUALIZER =====
let vizRAF=null;
function startVisualizer(targetCanvas){
    stopVisualizer();
    if(!S.analyser||S.settings.vizStyle==='off')return;
    const canvas=targetCanvas||$('vizCanvas');
    const ctx=canvas.getContext('2d');
    function draw(){
        vizRAF=requestAnimationFrame(draw);
        if(!canvas.offsetParent&&canvas!==$('vizCanvas'))return;
        const W=canvas.offsetWidth||canvas.width,H=canvas.offsetHeight||canvas.height;
        if(canvas.width!==W)canvas.width=W;
        if(canvas.height!==H)canvas.height=H;
        const data=new Uint8Array(S.analyser.frequencyBinCount);
        if(S.playing)S.analyser.getByteFrequencyData(data);
        ctx.clearRect(0,0,W,H);
        if(S.settings.vizStyle==='bars')drawBars(ctx,data,W,H);
        else if(S.settings.vizStyle==='wave')drawWave(ctx,data,W,H);
        else if(S.settings.vizStyle==='circular')drawCircular(ctx,data,W,H);
    }
    draw();
}
function stopVisualizer(){if(vizRAF){cancelAnimationFrame(vizRAF);vizRAF=null}}
function drawBars(ctx,data,W,H){
    const bars=Math.min(data.length,64),bw=W/bars;
    for(let i=0;i<bars;i++){
        const v=data[i]/255,bh=v*H*.85,hue=(i/bars)*60+140;
        ctx.fillStyle=`hsla(${hue},70%,55%,${.3+v*.6})`;
        ctx.fillRect(i*bw,H-bh,bw-1,bh);
    }
}
function drawWave(ctx,data,W,H){
    const timeData=new Uint8Array(S.analyser.frequencyBinCount);
    S.analyser.getByteTimeDomainData(timeData);
    ctx.beginPath();
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#1ed760';
    ctx.lineWidth=1.5;
    const step=W/timeData.length;
    for(let i=0;i<timeData.length;i++){const v=timeData[i]/128,y=v*H/2;if(i===0)ctx.moveTo(0,y);else ctx.lineTo(i*step,y)}
    ctx.stroke();
}
function drawCircular(ctx,data,W,H){
    const cx=W/2,cy=H/2,r=Math.min(W,H)*.3,bars=Math.min(data.length,48);
    for(let i=0;i<bars;i++){
        const v=data[i]/255,angle=(i/bars)*Math.PI*2-Math.PI/2,len=r*.2+v*r*.6;
        const x1=cx+Math.cos(angle)*r,y1=cy+Math.sin(angle)*r;
        const x2=cx+Math.cos(angle)*(r+len),y2=cy+Math.sin(angle)*(r+len);
        ctx.beginPath();ctx.strokeStyle=`hsla(${(i/bars)*120+140},70%,55%,${.4+v*.5})`;ctx.lineWidth=2;
        ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
}
document.addEventListener('visibilitychange',()=>{
    if(document.hidden)stopVisualizer();
    else if(S.playing&&(S.rpTab==='viz'||S.npoOpen))startVisualizer();
});

async function togglePiP(){
    if(S.mode==='tv'){
        const video=document.querySelector('.tv-player video');
        if(video){
            if(document.pictureInPictureElement)await document.exitPictureInPicture();
            else await video.requestPictureInPicture().catch(()=>toast('PiP not supported','','err'));
        }

            buildPiPDoc(pip);

// ===== DES DECRYPTION (JioSaavn) =====
const DES_KEY='38346a6d63673231';
async function decryptURL(encrypted){
    if(!encrypted)return'';
    try{
        const raw=atob(encrypted);const bytes=new Uint8Array(raw.length);
        for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
        const keyStr=hexToStr(DES_KEY);const keyBytes=new Uint8Array(keyStr.length);
        for(let i=0;i<keyStr.length;i++)keyBytes[i]=keyStr.charCodeAt(i);
        const decrypted=desEcbDec(bytes,keyBytes);
        const padLen=decrypted[decrypted.length-1];
        const unpadded=decrypted.slice(0,decrypted.length-(padLen>8?0:padLen));
        let url=new TextDecoder().decode(unpadded);
        url=url.replace(/_96\.mp4/,'_320.mp4').replace(/_96\.m4a/,'_320.m4a');
        return url;
    }catch{return''}
}
function hexToStr(h){let s='';for(let i=0;i<h.length;i+=2)s+=String.fromCharCode(parseInt(h.substr(i,2),16));return s}

async function disc3P(){

    for(let i=0;i<hosts.length&&SRC.tp.length<3;i+=8){
        const batch=hosts.slice(i,i+8);

}
async function probe3P(url){

}
