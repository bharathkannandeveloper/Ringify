                const d=await rfetch(`${src.url}${p}`,{timeout:9000,retries:1,signal});
                if(d){const pl=d?.data||d;const songs=(pl.songs||pl.tracks||pl.list||[]).map(r=>mkSong(r,'3p')).filter(s=>s.url&&s.title);if(songs.length)return songs}
            }
        }
    }
    return[];
}

// ===== RESOLVE STREAM URL =====
async function resolveStream(song){
    if(song.url&&song.url!=='__enc__')return song.url;
    if(song.encUrl){const u=await decryptURL(song.encUrl);if(u){song.url=u;return u}}
    if(song.id&&SRC.direct.alive){
        const d=await dFetch('song.getDetails',{pids:song.id});
        if(d){const det=d[song.id]||Object.values(d)[0];if(det?.encrypted_media_url){const u=await decryptURL(det.encrypted_media_url);if(u){song.url=u;song.encUrl=det.encrypted_media_url;return u}}}
    }
    return await findAlt(song);
}
async function findAlt(song){
    const ck=normKey(song.title,song.artist);
    const cached=S._stream.get(ck);if(cached)return cached;
    if(!SRC.tp.length)return'';
    for(const src of SRC.tp.slice(0,3)){
        try{
            const q=(song.title||'').slice(0,30)+' '+(song.artist||'').split(',')[0].trim();
            const d=await rfetch(`${src.url}/api/search/songs?query=${encodeURIComponent(q)}&limit=5`,{timeout:4000});
            if(!d)continue;
            const res=d?.data?.results||d?.results||[];
            let best='',score=0;
            for(const r of res){const u=get3PUrl(r);if(!u)continue;const s=sim(dec(r.name||r.title||''),song.title);if(s>score){score=s;best=u}}
            if(best&&score>.5){S._stream.set(ck,best);return best}
        }catch{}
    }
    return'';
}
function sim(a,b){
    if(!a||!b)return 0;
    const na=a.toLowerCase().replace(/[^a-z0-9]/g,''),nb=b.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(na===nb)return 1;if(na.includes(nb)||nb.includes(na))return.85;
    const ba=new Set(),bb=new Set();
    for(let i=0;i<na.length-1;i++)ba.add(na.slice(i,i+2));
    for(let i=0;i<nb.length-1;i++)bb.add(nb.slice(i,i+2));
    let inter=0;ba.forEach(x=>{if(bb.has(x))inter++});
    const u=ba.size+bb.size-inter;return u?inter/u:0;
}

/* ╔══════════════════════════════════════════════════════════════╗
   ║ RELATED SONGS ENGINE (NEW) — single source of truth for:    ║
   ║  • Right-panel "Related" tab   • NPO "Related" tab          ║
   ║  • Song Radio                  • Smart Queue continuation    ║
   ╚══════════════════════════════════════════════════════════════╝ */
async function getRelatedSongs(song,opts={}){
    if(!song)return[];
    const{limit=15,excludeIds=new Set()}=opts;
    const cacheKey='rel_'+normKey(song.title,song.artist);
    const cached=S._rel.get(cacheKey);
    if(cached)return cached.filter(s=>!excludeIds.has(s.id)).slice(0,limit);

    const seen=new Set(excludeIds);seen.add(song.id);
    const seenKeys=new Set();
    const results=[];

    // Strategy 1 — primary artist (highest relevance)
    const artistQ=(song.artist||'').split(',')[0].split('&')[0].split(/feat\.?/i)[0].trim();
    if(artistQ.length>=2){
        const artistSongs=await searchSongs(artistQ,1);
        for(const s of artistSongs){
            const k=normKey(s.title,s.artist);
            if(!seen.has(s.id)&&!seenKeys.has(k)){seen.add(s.id);seenKeys.add(k);s._reason='More from '+artistQ;results.push(s)}
        }
    }
    // Strategy 2 — same album/soundtrack (adds variety without losing relevance)
    if(song.album&&results.length<limit){
        const albumSongs=await searchSongs(song.album,1);
        for(const s of albumSongs){
            const k=normKey(s.title,s.artist);
            if(!seen.has(s.id)&&!seenKeys.has(k)){seen.add(s.id);seenKeys.add(k);s._reason='From '+song.album;results.push(s)}
        }
    }

    const final=results.slice(0,Math.max(limit,20));
    S._rel.set(cacheKey,final);
    return final.filter(s=>!excludeIds.has(s.id)).slice(0,limit);
}

// Loads related songs for whatever is currently playing; renders wherever it's visible
async function loadRelatedFor(song){
    if(!song)return;
    if(S.relatedFor===song.id&&S.related.length)return;
    S.relatedBusy=true;S.relatedFor=song.id;S.related=[];
    _refreshRelatedUI();
    const excludeIds=new Set([...S.queue.map(s=>s.id),...S.songs.map(s=>s.id),song.id]);
    const rel=await getRelatedSongs(song,{limit:15,excludeIds});
    if(S.relatedFor!==song.id)return; // song changed mid-fetch — discard
    S.related=rel;S.relatedBusy=false;
    _refreshRelatedUI();
}
function _refreshRelatedUI(){
    if(typeof renderRP==='function'&&S.rpTab==='related')renderRP();
    if(typeof renderNPOSide==='function'&&S.npoOpen&&S.npoTab==='related')renderNPOSide();

    }

    if(results.length){S._sugC.set(q,results);renderSug(results)}else hideSug();

<div class="card-img">${p.img?`<img src="${esc(p.img)}" loading="lazy">`:iconPlaceholder('playlist',p.title)}<div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>

}

function setNav(v){$$('.nav-i').forEach(n=>n.classList.toggle('on',n.dataset.v===v));$$('.mob-i').forEach(n=>n.classList.toggle('on',n.dataset.v===v))}

// ===== VIEW RESTORE (overrides Part 2 stub — full router for back/forward) =====
function restoreV(v){
    if(!v)return;
    if(v.type==='home'&&typeof showHome==='function')showHome(true);
    else if(v.type==='search'){S.searchTab=v.tab||'songs';if(v.query){inp.value=v.query;updateSearchClear();initSearch(v.query,true)}else{inp.value='';updateSearchClear();renderSearchLanding()}}
    else if(v.type==='searchLanding'){inp.value='';updateSearchClear();S.view='search';setNav('search');renderSearchLanding()}
    else if(v.type==='artist'&&typeof openArtistDetail==='function')openArtistDetail(v.id,v.name,true);
    else if(v.type==='album'&&typeof openAlbumDetail==='function')openAlbumDetail(v.id,v.title,true);
    else if(v.type==='playlist'&&typeof openPlaylistDetail==='function')openPlaylistDetail(v.id,v.title,true);
    else if(v.type==='liked'&&typeof showLiked==='function')showLiked(true);
    else if(v.type==='artists'&&typeof showArtistsPage==='function')showArtistsPage(true);
    else if(v.type==='radio'&&typeof showRadioPage==='function')showRadioPage(true);
    else if(v.type==='tv'&&typeof showTVPage==='function')showTVPage(true);

// ===== MODE INDICATOR (kept single source — old duplicate removed) =====
// updModeUI() already defined in Part 2; nothing duplicated here.

console.log('%c♪ Ringify v6%c Part 4/8 loaded (Search + Rendering + Landing)','background:linear-gradient(90deg,#1ed760,#a3e635);color:#000;padding:3px 8px;border-radius:4px;font-weight:900','color:#6a6a6a;padding:3px');
</script>
<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║ RINGIFY v6 — Part 5/8: Queue Engine + Detail Pages           ║
// ║ Real "Up Next" (manual + natural), drag/reorder, skip-set    ║
// ║ Artist / Album / Playlist detail, Local playlists            ║
// ╚══════════════════════════════════════════════════════════════╝

S._skipIds=S._skipIds||new Set();   // ids to exclude from natural continuation
S._pendingSource=null;              // label staged by page views, committed on play

/* ╔══════════════════════════════════════════════════════════════╗
   ║ QUEUE ENGINE                                                  ║
   ╚══════════════════════════════════════════════════════════════╝ */

// Called by every page-render function right after `S.songs = list`.
// Purely informational — does NOT touch manualQueue/skipIds/live queue.
function primeQueueContext(source){S._pendingSource=source||null}

// Recompute the displayable "Up Next" list: manual picks first, then
// natural continuation from S.songs (respecting shuffle + skip-set).
function rebuildQueue(){
    let natural=[];
    if(S.songs.length){
        if(S.shuffle){
            natural=S.songs.filter((s,i)=>i!==S.idx&&!S._skipIds.has(s.id)&&!S.manualQueue.some(m=>m.id===s.id));
        }else{
            natural=S.songs.slice(S.idx+1).filter(s=>!S._skipIds.has(s.id)&&!S.manualQueue.some(m=>m.id===s.id));
        }
    }
    S.queue=[
        ...S.manualQueue.map(s=>({...s,_qType:'manual'})),
        ...natural.map(s=>({...s,_qType:'natural'}))
    ];
    if(typeof renderRP==='function'&&S.rpTab==='queue')renderRP();
    if(typeof renderNPOSide==='function'&&S.npoOpen&&S.npoTab==='queue')renderNPOSide();
    if(typeof qSave==='function')qSave();
}

// Advance to the next track respecting manual-queue priority.
// fromEnded=true means called from the 'ended' event (repeat-all wraps,
// otherwise returns false so caller can fall back to Smart Queue/stop).
// fromEnded=false (manual Next press) always wraps around.
function advanceQueue(fromEnded){
    if(S.manualQueue.length){
        const next=S.manualQueue.shift();
        S._skipIds.delete(next.id);
        insertAndPlay(next);
        return true;
    }
    if(!S.songs.length)return false;
    if(S.shuffle){
        if(S.songs.length<=1)return false;
        let n,tries=0;
        do{n=Math.floor(Math.random()*S.songs.length);tries++}while((n===S.idx||S._skipIds.has(S.songs[n].id))&&tries<50);
        if(typeof playSong==='function')playSong(n,{internal:true});
        return true;
    }
    let n=S.idx+1;
    while(n<S.songs.length&&S._skipIds.has(S.songs[n].id))n++;
    if(n<S.songs.length){if(typeof playSong==='function')playSong(n,{internal:true});return true}
    if(fromEnded&&S.repeat==='all'){if(typeof playSong==='function')playSong(0,{internal:true});return true}
    if(!fromEnded){if(typeof playSong==='function')playSong(0,{internal:true});return true}
    return false;
}

// Plays `song` right now — if it's not in the active context list, it's
// spliced in immediately after the current index so it feels seamless.
function insertAndPlay(song){
    let si=S.songs.findIndex(x=>x.id===song.id);
    if(si<0){S.songs.splice(S.idx+1,0,song);si=S.idx+1}
    if(typeof playSong==='function')playSong(si,{internal:true});
}

// ===== MANUAL QUEUE MUTATIONS =====
function addToQueue(song){
    if(!song)return;
    if(S.manualQueue.some(s=>s.id===song.id)||S.cur?.id===song.id){toast('Already queued');return}
    S.manualQueue.push({...song});
    S._skipIds.delete(song.id);
    rebuildQueue();toast('Added to queue','','ok');
}
function playNextInQueue(song){
    if(!song)return;
    const existing=S.manualQueue.findIndex(s=>s.id===song.id);
    if(existing>=0)S.manualQueue.splice(existing,1);
    S.manualQueue.unshift({...song});
    S._skipIds.delete(song.id);
    rebuildQueue();toast('Playing next','','ok');
}
function addAllToQueue(){
    if(!S.songs.length)return;
    let added=0;
    S.songs.forEach(s=>{
        if(S.cur?.id===s.id)return;
        if(!S.manualQueue.some(m=>m.id===s.id)){S.manualQueue.push({...s});added++}
        S._skipIds.delete(s.id);
    });
    rebuildQueue();toast(`Added ${added} songs to queue`,'','ok');
}
function removeFromQueue(id){
    const mi=S.manualQueue.findIndex(s=>s.id===id);
    if(mi>=0)S.manualQueue.splice(mi,1);
    else S._skipIds.add(id);
    rebuildQueue();
}
function clearQueue(){
    S.manualQueue=[];
    S._skipIds=new Set(S.songs.map(s=>s.id));
    if(S.cur)S._skipIds.delete(S.cur.id);
    rebuildQueue();toast('Queue cleared');
}
function playFromQueue(id){
    const item=S.queue.find(q=>q.id===id);if(!item)return;
    const mi=S.manualQueue.findIndex(s=>s.id===id);
    if(mi>=0)S.manualQueue.splice(mi,1);
    S._skipIds.delete(id);
    insertAndPlay(item);
}

// ===== DRAG / REORDER (manual queue only — natural order follows the source list) =====
function reorderManualQueue(fromId,toId){
    const list=S.manualQueue;
    const fi=list.findIndex(s=>s.id===fromId),ti=list.findIndex(s=>s.id===toId);
    if(fi<0||ti<0||fi===ti)return;
    const[item]=list.splice(fi,1);list.splice(ti,0,item);
    rebuildQueue();
}
function moveQueueItem(id,dir){
    const list=S.manualQueue;const i=list.findIndex(s=>s.id===id);if(i<0)return;
    const j=i+dir;if(j<0||j>=list.length)return;
    [list[i],list[j]]=[list[j],list[i]];rebuildQueue();
}
// Called by whichever panel renders the queue (Part 7's rp / Part 6's NPO side)
// after inserting the HTML, to wire native HTML5 drag-and-drop on manual items.
function attachQueueDragHandlers(container){
    if(!container)return;
    let dragId=null;
    container.querySelectorAll('.queue-item[draggable="true"]').forEach(el=>{
        el.addEventListener('dragstart',()=>{dragId=el.dataset.qid;el.classList.add('dragging')});
        el.addEventListener('dragend',()=>{el.classList.remove('dragging');container.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))});
        el.addEventListener('dragover',e=>{e.preventDefault();if(el.dataset.qid!==dragId)el.classList.add('drag-over')});
        el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
        el.addEventListener('drop',e=>{
            e.preventDefault();el.classList.remove('drag-over');
            const toId=el.dataset.qid;
            if(dragId&&toId&&dragId!==toId)reorderManualQueue(dragId,toId);
        });
    });
}

// ===== PLAY ALL / SHUFFLE (commit S.songs as the new active context) =====
function playAll(){if(!S.songs.length)return;if(typeof playSong==='function')playSong(0)}
function shuffleAll(){
    if(!S.songs.length)return;
    S.songs=[...S.songs].sort(()=>Math.random()-.5);
    if(typeof playSong==='function')playSong(0);
}

// ===== SONG RADIO (uses the Related engine from Part 3) =====
async function songRadio(song){
    if(!song)return;
    toast('Starting song radio…');
    const rel=await getRelatedSongs(song,{limit:30,excludeIds:new Set([song.id])});
    if(!rel.length){toast('No related songs found','','err');return}
    S.songs=[song,...rel];
    primeQueueContext({type:'radio',title:'Song Radio · '+song.title});
    if(typeof playSong==='function')playSong(0);
}

/* ╔══════════════════════════════════════════════════════════════╗
   ║ ARTIST DETAIL (paginated Load More)                          ║
   ╚══════════════════════════════════════════════════════════════╝ */
async function openArtistDetail(id,name,skipHist){
    S.view='artist';killInf();setGrad(name,'artist');
    showDetSkel('artist');
    if(!skipHist)pushV({type:'artist',id,name});
    setNav('artists');

    const reqId=newReq();const signal=S._ac.signal;
    let data=await fetchArtist(id,signal);
    if(isStale(reqId))return;

    if(!data&&name){
        const songs=await searchSongs(name,1,signal);
        if(isStale(reqId))return;
        if(songs.length)data={info:{id,name,img:'',followers:0,verified:false,bio:''},songs,albums:[],singles:[]};
    }
    if(!data){
        $('page').innerHTML=`<div style="padding:28px var(--sp-6)"><h2>${esc(name)}</h2><p class="u-c3" style="margin-top:4px">Couldn't load artist.</p><button class="abtn sec" style="margin-top:6px" onclick="openArtistDetail('${id}','${esc(name).replace(/'/g,"\\'")}')">Retry</button></div>`;
        return;
    }

    S.songs=data.songs;
    primeQueueContext({type:'artist',id,title:data.info?.name||name});
    S._artPages={sP:2,aP:2,sD:data.songs.length<15,aD:(data.albums||[]).length<8,id};
    renderArtistPage(data);
}

function renderArtistPage(data){
    const{info,songs,albums,singles}=data;
    setGrad(info.name,'artist');

    let h=`<div style="display:flex;align-items:flex-end;gap:var(--sp-7);padding:32px var(--sp-6) 0;min-height:200px;flex-wrap:wrap;position:relative;z-index:1">
<div style="width:128px;height:128px;border-radius:50%;flex-shrink:0;overflow:hidden;box-shadow:var(--e2);position:relative">${info.img?`<img src="${esc(info.img)}" style="width:100%;height:100%;object-fit:cover">`:iconPlaceholder('artist',info.name)}</div>
<div style="padding-bottom:var(--sp-3);flex:1;min-width:120px">
<div style="font-size:var(--fs-2xs);font-weight:700;color:var(--artist);text-transform:uppercase;letter-spacing:.2px;margin-bottom:2px">${info.verified?'✓ Verified ':''}Artist</div>
<h1 style="font-size:clamp(16px,4vw,32px);font-weight:900;letter-spacing:-.02em;line-height:1.1">${esc(info.name)}</h1>
${info.followers?`<div class="u-fs-sm u-c2" style="margin-top:2px">${fmtK(info.followers)} followers</div>`:''}
${info.bio?`<div class="u-fs-xs u-c3 u-clamp2" style="margin-top:2px;max-width:280px">${esc(info.bio)}</div>`:''}
</div></div>`;

    h+=`<div class="actions">
<button class="abtn pri" onclick="playAll()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Play</button>

async function lmSongs(){

    const songs=await fetchArtistSongs(S._artPages.id,S._artPages.sP);
    if(!songs.length){S._artPages.sD=true;const el=$('lmS');if(el)el.innerHTML='<div class="end-msg">All songs loaded</div>';return}
    const start=S.songs.length;
    songs.forEach(s=>{const k=normKey(s.title,s.artist);if(!S.seen.has(k)){S.seen.add(k);S.songs.push(s)}});
    const container=$('artSongs');
    if(container)container.insertAdjacentHTML('beforeend',S.songs.slice(start).map((s,i)=>trackRow(s,start+i)).join(''));

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║ RINGIFY v6 — Part 6/8: Playback Engine                       ║
// ║ Desktop Now-Playing Overlay · Context Menu · MediaSession    ║
// ╚══════════════════════════════════════════════════════════════╝

/* ╔══════════════════════════════════════════════════════════════╗
   ║ CORE PLAYBACK — fulfills Part 5's playSong(idx,opts) contract ║
   ╚══════════════════════════════════════════════════════════════╝ */
async function playSong(idx,opts={}){
    const song=S.songs[idx];
    if(!song){toast('Track not found','','err');return}

    if(!opts.internal){
        // Direct pick / Play-All / context-menu Play -> commit fresh context
        S.queueSource=S._pendingSource||null;
        S.manualQueue=[];
        S._skipIds=new Set();
    }

    if(!S.audioCtx)initAudioPipeline();
    resumeAudio();

    S.idx=idx;S.cur=song;S.mode='music';updModeUI();
    rebuildQueue();

    const url=await resolveStream(song);
    if(!url){toast('No stream — skipping','','err');autoNext();return}
    song.url=url;

    addHistory(S.history,song,50);
    updPlayerUI();updMobP();setGrad(song.title,'song');

    au.src=url;au.playbackRate=S.speed;
    try{
        await au.play();
        S.playing=true;updIcons();refreshRows();
        if(typeof fetchLyrics==='function')fetchLyrics(song);
        if(typeof loadRelatedFor==='function')loadRelatedFor(song);
        if(typeof renderRP==='function')renderRP();
        if(S.npoOpen)renderNPO();
        updatePiP();qSave();
    }catch(e){
        const ok=await failover(song);
        if(!ok){toast('Playback failed','','err');autoNext()}
    }
}

async function failover(song){
    for(let i=0;i<3;i++){
        const alt=await findAlt(song);
        if(!alt||alt===song.url)continue;
        song.url=alt;au.src=alt;
        try{
            await au.play();
            S.playing=true;updIcons();refreshRows();
            if(typeof fetchLyrics==='function')fetchLyrics(song);
            if(typeof loadRelatedFor==='function')loadRelatedFor(song);
            if(typeof renderRP==='function')renderRP();
            if(S.npoOpen)renderNPO();
            updatePiP();toast('Source switched','','ok');
            return true;
        }catch{continue}
    }
    return false;
}
function autoNext(){setTimeout(()=>{if(S.songs.length>1)playNext();else{S.playing=false;updIcons()}},200)}

function togglePlay(){
    if(!S.cur)return;
    if(!S.audioCtx)initAudioPipeline();
    resumeAudio();
    if(S.playing){au.pause()}
    else{au.play().catch(async()=>{if(S.mode==='music'){const ok=await failover(S.cur);if(!ok)toast('Error','','err')}})}
    S.playing=!S.playing;updIcons();updatePiP();
}

// Thin wrappers over Part 5's queue engine
function playNext(){advanceQueue(false)}
function playPrev(){
    if(au.currentTime>3){au.currentTime=0;return}
    if(!S.songs.length)return;
    let n=S.idx-1;if(n<0)n=S.songs.length-1;
    playSong(n,{internal:true});
}

    try{
        const c=S._lyr.get(key);if(c){S.lyrics=c.l;S.lyrSrc=c.s;return}
        if(SRC.direct.alive&&song.hasLyr){const sv=await lyrSaavn(song);if(sv){S.lyrics=sv.l;S.lyrSrc=sv.synced?'JioSaavn ♪':'JioSaavn';S._lyr.set(key,{l:sv.l,s:S.lyrSrc});return}}
        const lrc=await lyrLRCLIB(t,a,dur);if(lrc){S.lyrics=lrc.l;S.lyrSrc=lrc.synced?'LRCLIB ♪':'LRCLIB';S._lyr.set(key,{l:lrc.l,s:S.lyrSrc});return}
        const ly=await lyrLyrist(t,a);if(ly){S.lyrics=ly;S.lyrSrc='Lyrist';S._lyr.set(key,{l:ly,s:S.lyrSrc});return}
        const ovh=await lyrOvh(t,a);if(ovh){S.lyrics=ovh;S.lyrSrc='lyrics.ovh';S._lyr.set(key,{l:ovh,s:S.lyrSrc});return}
        const ch=await lyrChart(t,a);if(ch){S.lyrics=ch;S.lyrSrc='ChartLyrics';S._lyr.set(key,{l:ch,s:S.lyrSrc});return}
        const simple=t.replace(/\(.*?\)|\[.*?\]|[-–—].*$/g,'').trim();
        if(simple!==t&&simple.length>=3){
            const lrc2=await lyrLRCLIB(simple,a,dur);if(lrc2){S.lyrics=lrc2.l;S.lyrSrc=lrc2.synced?'LRCLIB ♪':'LRCLIB';S._lyr.set(key,{l:lrc2.l,s:S.lyrSrc});return}
            const ly2=await lyrLyrist(simple,a);if(ly2){S.lyrics=ly2;S.lyrSrc='Lyrist';S._lyr.set(key,{l:ly2,s:S.lyrSrc});return}
        }
        if(song.album&&song.album!==a){
            const lrc3=await lyrLRCLIB(t,song.album,dur);if(lrc3){S.lyrics=lrc3.l;S.lyrSrc=lrc3.synced?'LRCLIB ♪':'LRCLIB';S._lyr.set(key,{l:lrc3.l,s:S.lyrSrc});return}
        }
    }finally{
        S.lyrBusy=false;
        if(S.rpTab==='lyrics')renderRP();
        if(S.npoOpen&&S.npoTab==='lyrics')renderNPOSide();
    }
}

async function lyrSaavn(song){
    try{
        const d=await dFetch('lyrics.getLyrics',{lyrics_id:song.id});
        if(!d)return null;
        const txt=d?.lyrics||d?.data?.lyrics;
        if(txt&&typeof txt==='string'&&txt.length>20){
            if(/\[\d+:\d+/.test(txt)){const l=parseLRC(txt);if(l.length>2)return{l,synced:true}}
            const plain=txt.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]*>/g,'').trim().split('\n').filter(x=>x.trim()).map(x=>({t:0,x:x.trim()}));
            if(plain.length>2)return{l:plain,synced:false};
        }
    }catch{}
    return null;
}
async function lyrLRCLIB(title,artist,dur){
    const ct=title.replace(/\(feat\.?.*?\)|\(ft\.?.*?\)|\(remix\)|\(official.*?\)/gi,'').trim();
    const ca=artist.replace(/feat\.?.*|ft\.?.*/gi,'').trim();
    if(!ct||!ca)return null;
    let url=`https://lrclib.net/api/get?track_name=${encodeURIComponent(ct)}&artist_name=${encodeURIComponent(ca)}`;
    if(dur>0)url+=`&duration=${dur}`;
    let data=await rfetch(url,{timeout:4500,retries:1});
    if(!data){
        const sr=await rfetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(ct)}&artist_name=${encodeURIComponent(ca)}`,{timeout:4500,retries:0});
        if(sr&&Array.isArray(sr)&&sr.length)data=dur>0?(sr.find(r=>Math.abs((r.duration||0)-dur)<5)||sr[0]):sr[0];
    }
    if(!data)return null;
    const e=Array.isArray(data)?data[0]:data;if(!e)return null;
    if(e.syncedLyrics?.trim()){const l=parseLRC(e.syncedLyrics);if(l.length)return{l,synced:true}}
    if(e.plainLyrics?.trim()){const l=e.plainLyrics.split('\n').filter(x=>x.trim()).map(x=>({t:0,x:x.trim()}));if(l.length>2)return{l,synced:false}}
    return null;
}
async function lyrLyrist(title,artist){
    if(!title||!artist)return null;
    try{
        const ct=title.replace(/\(.*?\)|\[.*?\]/g,'').trim();
        const ca=artist.replace(/feat\.?.*|ft\.?.*/gi,'').trim();
        if(!ct||!ca)return null;
        const r=await fetch(`https://lyrist.vercel.app/api/${encodeURIComponent(ct)}/${encodeURIComponent(ca)}`,{signal:AbortSignal.timeout(4500)});
        if(!r.ok)return null;
        const d=await r.json();
        if(d?.lyrics&&d.lyrics.length>20)return d.lyrics.split('\n').filter(x=>x.trim()).map(x=>({t:0,x:x.trim()}));
    }catch{}
    return null;
}
async function lyrOvh(title,artist){
    if(!title||!artist)return null;
    try{
        const ct=title.replace(/\(.*?\)|\[.*?\]/g,'').trim();
        const ca=artist.replace(/feat\.?.*|ft\.?.*/gi,'').trim();
        if(!ct||!ca)return null;
        const d=await rfetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(ca)}/${encodeURIComponent(ct)}`,{timeout:4500,retries:0});
        if(!d?.lyrics||d.lyrics.length<20)return null;
        return d.lyrics.split('\n').filter(x=>x.trim()).map(x=>({t:0,x:x.trim()}));
    }catch{}
    return null;
}
async function lyrChart(title,artist){
    if(!title||!artist)return null;
    try{
        const ct=title.replace(/\(.*?\)|\[.*?\]/g,'').trim();
        const ca=artist.replace(/feat\.?.*|ft\.?.*/gi,'').trim();
        if(!ct||!ca)return null;
        const proxies=['https://corsproxy.io/?','https://api.allorigins.win/raw?url='];
        const api=`http://api.chartlyrics.com/apiv1.asmx/SearchLyricDirect?artist=${encodeURIComponent(ca)}&song=${encodeURIComponent(ct)}`;
        for(const proxy of proxies){
            try{
                const r=await fetch(proxy+encodeURIComponent(api),{signal:AbortSignal.timeout(5000)});
                if(!r.ok)continue;
                const text=await r.text();
                const xml=new DOMParser().parseFromString(text,'text/xml');
                const node=xml.getElementsByTagName('Lyric')[0];
                if(!node?.textContent||node.textContent.trim().length<20)continue;
                return node.textContent.trim().split('\n').filter(x=>x.trim()).map(x=>({t:0,x:x.trim()}));
            }catch{continue}
        }
    }catch{}
    return null;
}
function parseLRC(s){
    if(!s)return[];const p=[];
    for(const l of s.split('\n')){
        const m=l.match(/^\[(\d+):(\d+)[.:]+(\d+)\]\s*(.*)/);
        if(m){const ms=m[3].length<=2?parseInt(m[3])*10:parseInt(m[3]);const t=parseInt(m[1])*60+parseInt(m[2])+ms/1000;if(m[4].trim())p.push({t,x:m[4].trim()})}
        else{const m2=l.match(/^\[(\d+):(\d+)\]\s*(.*)/);if(m2&&m2[3].trim())p.push({t:parseInt(m2[1])*60+parseInt(m2[2]),x:m2[3].trim()})}
    }
    return p.sort((a,b)=>a.t-b.t);
}
function syncLyr(){
    if(!S.lyrics?.length||!S.lyrics.some(l=>l.t>0))return;
    let n=0;const ct=au.currentTime;
    for(let i=0;i<S.lyrics.length;i++){if(S.lyrics[i].t<=ct+.1)n=i;else break}
    if(n===S.lyrIdx)return;S.lyrIdx=n;
    document.querySelectorAll('.lln').forEach((el,i)=>{
        // (works across both rp-body and npo-side-body since both render the same markup)
    });
    const containers=[document.querySelector('#rpBody'),document.querySelector('#npoSideBody')].filter(Boolean);
    containers.forEach(cont=>{
        const all=cont.querySelectorAll('.lln');
        if(all.length){all.forEach((el,i)=>{el.className=i===n?'lln on':i<n?'lln past':'lln'});if(cont===document.querySelector('#rpBody'))all[n]?.scrollIntoView({behavior:'smooth',block:'center'})}
    });
}

function filterRadio(){
    const q=($('radioQ')?.value||'').trim();
    const country=$('radioCountry')?.value||'';
    const lang=$('radioLang')?.value||'';
    const tag=$('radioTag')?.value||'';
    const br=parseInt($('radioBR')?.value)||0;

    if(q&&!country&&!lang&&!tag&&!br){radioSearchDeb(q);return}

    let filtered=S.radioStations;
    if(q)filtered=filtered.filter(r=>(r.name+' '+r.country+' '+r.language+' '+r.tags.join(' ')).toLowerCase().includes(q.toLowerCase()));
    if(country)filtered=filtered.filter(r=>r.country===country);
    if(lang)filtered=filtered.filter(r=>r.language.toLowerCase().includes(lang.toLowerCase()));
    if(tag)filtered=filtered.filter(r=>r.tags.some(t=>t.toLowerCase()===tag.toLowerCase()));
    if(br)filtered=filtered.filter(r=>r.bitrate>=br);

    renderRadioList(filtered);
    const title=$('radioTitle');if(title)title.textContent=q||country||lang||tag?'Filtered':'Popular Stations';

async function playRadio(stationId){
    const station=_renderedRadio.find(r=>r.id===stationId)||S.radioStations.find(r=>r.id===stationId)||S.favRadios.find(r=>r.id===stationId);

async function tryRadioStream(url){
    return new Promise(resolve=>{
        au.pause();au.src=url;
        const onPlay=()=>{cleanup();S.playing=true;updIcons();updatePiP();toast('Playing','','ok');resolve(true)};
        const onError=()=>{cleanup();resolve(false)};
        const timeout=setTimeout(()=>{cleanup();resolve(false)},10000);
        function cleanup(){clearTimeout(timeout);au.removeEventListener('playing',onPlay);au.removeEventListener('error',onError)}
        au.addEventListener('playing',onPlay,{once:true});
        au.addEventListener('error',onError,{once:true});
        au.load();au.play().catch(()=>{cleanup();resolve(false)});
    });
}

function mergeTV(channels,streams,blocklist){
    const blockSet=new Set((blocklist||[]).map(b=>b.channel||b.id||'').filter(Boolean));
    const streamMap={};
    streams.forEach(s=>{if(!s.channel||!s.url)return;if(!streamMap[s.channel])streamMap[s.channel]=[];streamMap[s.channel].push(s)});
    const merged=[];
    channels.forEach(ch=>{
        if(blockSet.has(ch.id)||ch.is_nsfw)return;
        const chStreams=streamMap[ch.id];if(!chStreams||!chStreams.length)return;
        const best=pickBestTV(chStreams);if(!best||!best.url)return;
        const safeName=(ch.name||'tv').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
        const domain=ch.website||`${safeName}.tv`;
        merged.push({
            id:ch.id,name:ch.name||'Unknown',
            category:Array.isArray(ch.categories)?ch.categories[0]:(ch.category||''),
            categories:Array.isArray(ch.categories)?ch.categories:[ch.category].filter(Boolean),
            country:Array.isArray(ch.countries)?ch.countries[0]:(ch.country||''),
            language:inferTVLang(ch),
            logo:`https://www.google.com/s2/favicons?sz=128&domain_url=${encodeURIComponent(domain)}`,
            website:ch.website||'',quality:normQ(best.quality),url:best.url,
            urls:chStreams.map(s=>({url:s.url,quality:s.quality||'SD'})),type:'tv'
        });
    });
    return merged;
}
function pickBestTV(streams){const order=['2160p','1080p','720p','FHD','HD','4K','SD'];return[...streams].sort((a,b)=>{const qa=order.indexOf(a.quality||'SD'),qb=order.indexOf(b.quality||'SD');return(qa===-1?99:qa)-(qb===-1?99:qb)})[0]}
function normQ(q){if(!q)return'SD';q=q.toUpperCase();if(q.includes('4K')||q.includes('2160'))return'4K';if(q.includes('1080')||q.includes('FHD'))return'1080p';if(q.includes('720')||q.includes('HD'))return'720p';return'SD'}
function inferTVLang(ch){
    const name=(ch.name||'').toLowerCase();
    const map={tamil:'Tamil',telugu:'Telugu',malayalam:'Malayalam',kannada:'Kannada',hindi:'Hindi',bengali:'Bengali',english:'English',spanish:'Spanish',french:'French',arabic:'Arabic',chinese:'Chinese',korean:'Korean',japanese:'Japanese'};
    for(const[k,v]of Object.entries(map))if(name.includes(k))return v;
    const cMap={IN:'Hindi',US:'English',GB:'English',FR:'French',DE:'German',ES:'Spanish',JP:'Japanese',KR:'Korean',CN:'Chinese'};
    const country=Array.isArray(ch.countries)?ch.countries[0]:(ch.country||'');
    return cMap[country]||'Other';
}

    const el=$('tvGrid');if(!el)return;
    if(!channels.length){el.innerHTML='<div class="empty" style="padding:12px"><h3>No channels found</h3></div>';return}
    el.innerHTML=channels.slice(0,120).map(ch=>tvCard(ch)).join('');
}
function tvCard(ch){
    const isOn=S.cur?.id===ch.id&&S.mode==='tv';
    const isFav=S.favTV.some(f=>f.id===ch.id);
    const qColor=ch.quality==='4K'?'var(--gold)':ch.quality==='1080p'?'#22c55e':ch.quality==='720p'?'var(--tv)':'var(--t3)';
    return`<div class="tv-ch ${isOn?'on':''}" onclick="playTV('${ch.id}')">
<img src="${esc(ch.logo)}" loading="lazy" onerror="this.style.visibility='hidden'">
<div class="tv-name">${esc(ch.name)}</div>
<span class="tv-q" style="color:${qColor}">${ch.quality}</span>
<button onclick="event.stopPropagation();toggleFavTV('${ch.id}')" style="width:14px;height:14px;display:grid;place-items:center;color:${isFav?'var(--tv)':'var(--t4)'};flex-shrink:0" aria-label="Favorite"><svg viewBox="0 0 24 24" fill="${isFav?'currentColor':'none'}" stroke="currentColor" stroke-width="2" width="8" height="8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
</div>`;
}

function playTV(chId){
    const ch=S.tvChannels.find(c=>c.id===chId)||S.favTV.find(c=>c.id===chId);
    if(!ch){toast('Channel not found','','err');return}
    if(!S.audioCtx)initAudioPipeline();
    resumeAudio();

    S.cur={id:ch.id,title:ch.name,artist:ch.category+(ch.country?' · '+ch.country:''),img:ch.logo,url:ch.url,type:'tv',dur:0};
    S.mode='tv';updModeUI();updPlayerUI();updMobP();setGrad(ch.name,'tv');
    addHistory(S.tvHistory,ch,30);

    const nn=$('tvNowName');if(nn)nn.textContent=ch.name;
    const nm=$('tvNowMeta');if(nm)nm.textContent=`${ch.category||''} · ${ch.country||''} · ${ch.quality}`;
    $('tCur').textContent='LIVE';$('tDur').textContent='∞';$('pFill').style.width='100%';

    playTVStream(ch.url,ch.urls||[]);
    if(S.view==='tv')renderTVGrid(S.tvChannels);
}

function playTVStream(url,altUrls){
    const video=$('tvVideo');const overlay=$('tvOverlay');
    if(!video)return;
    if(S.tvHls){S.tvHls.destroy();S.tvHls=null}
    video.pause();video.removeAttribute('src');video.load();
    if(overlay)overlay.style.display='none';

    if(tvAudioOnly){
        au.src=url;au.play().then(()=>{S.playing=true;updIcons();updatePiP();toast('Audio only','','ok')}).catch(()=>{
            const remaining=altUrls.filter(s=>s.url!==url);
            if(remaining.length)playTVStream(remaining[0].url,remaining.slice(1));
            else{toast('Stream failed','','err');S.playing=false;updIcons()}
        });
        return;
    }

    if(typeof Hls!=='undefined'&&Hls.isSupported()&&url.includes('.m3u8')){
        const hls=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:45,maxBufferLength:15,fragLoadingMaxRetry:3,manifestLoadingMaxRetry:3,enableCEA708Captions:true,enableWebVTT:true});
        hls.loadSource(url);hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});S.playing=true;updIcons();updatePiP()});
        hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED,(e,data)=>{if(data.subtitleTracks?.length&&S.settings.tvSubtitles)hls.subtitleTrack=0});
        hls.on(Hls.Events.CUES_PARSED,(e,data)=>{if(S.settings.tvSubtitles&&data.cues?.length)showSubtitle(data.cues[data.cues.length-1].text||'')});
        hls.on(Hls.Events.ERROR,(event,data)=>{
            if(data.fatal){
                const remaining=altUrls.filter(s=>s.url!==url);
                if(remaining.length){toast('Trying alternate...');hls.destroy();S.tvHls=null;playTVStream(remaining[0].url,remaining.slice(1))}
                else{if(overlay){overlay.style.display='flex';overlay.textContent='Stream unavailable'}toast('TV stream failed','','err');S.playing=false;updIcons()}
            }
        });
        S.tvHls=hls;
    }else{
        video.src=url;video.play().catch(()=>{});S.playing=true;updIcons();updatePiP();
    }

    video.onerror=()=>{
        const remaining=altUrls.filter(s=>s.url!==url);
        if(remaining.length)playTVStream(remaining[0].url,remaining.slice(1));
        else{if(overlay){overlay.style.display='flex';overlay.textContent='Playback failed'}S.playing=false;updIcons()}
    };

    // Route TV audio through the shared FX chain — fixed via Part 2's attachMediaSource
    // (sets crossOrigin, guards against double-attach, gracefully no-ops on CORS failure)
    attachMediaSource(video);
}

let subTimer=null;
function showSubtitle(text){
    const el=$('tvSubs');if(!el)return;
    if(!text||!S.settings.tvSubtitles){el.classList.remove('show');return}
    el.textContent=text;el.classList.add('show');
    el.style.fontSize={small:'9px',medium:'11px',large:'14px'}[S.settings.tvSubSize]||'11px';
    el.style.color=S.settings.tvSubColor||'#fff';
    clearTimeout(subTimer);subTimer=setTimeout(()=>el.classList.remove('show'),5000);
}
function toggleTVAudioOnly(){
    tvAudioOnly=!tvAudioOnly;
    const btn=$('tvAudioBtn');
    if(btn){btn.style.color=tvAudioOnly?'var(--tv)':'';btn.style.borderColor=tvAudioOnly?'var(--tv)':''}
    toast(tvAudioOnly?'Audio only ON':'Audio only OFF');
    if(S.mode==='tv'&&S.cur){const ch=S.tvChannels.find(c=>c.id===S.cur.id)||S.favTV.find(c=>c.id===S.cur.id);if(ch)playTV(ch.id)}
}
function stopTV(){
    if(S.tvHls){S.tvHls.destroy();S.tvHls=null}
    const video=$('tvVideo');if(video){video.pause();video.removeAttribute('src');video.load()}
    const overlay=$('tvOverlay');if(overlay){overlay.style.display='flex';overlay.textContent='Select a channel'}
    if(S.mode==='tv'){au.pause();au.src=''}
    S.playing=false;S.mode='idle';updIcons();updModeUI();
    $('tCur').textContent='0:00';$('tDur').textContent='0:00';$('pFill').style.width='0%';
    const nn=$('tvNowName');if(nn)nn.textContent='—';
    const nm=$('tvNowMeta');if(nm)nm.textContent='';
}
function toggleFavTV(id){
    const idx=S.favTV.findIndex(c=>c.id===id);
    if(idx>=0){S.favTV.splice(idx,1);toast('Removed')}
    else{const ch=S.tvChannels.find(c=>c.id===id);if(ch){S.favTV.push(ch);toast('Saved','','ok')}}
    SS('r_fav_tv',S.favTV);
    if(S.view==='tv')showTVPage(true);
}
function cleanupTV(){if(S.tvHls&&S.view!=='tv'&&S.mode!=='tv'){S.tvHls.destroy();S.tvHls=null}}

<button class="pc" onclick="playNext()" ${!isMusic?'style="opacity:.3;pointer-events:none"':''} aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg></button>
<button class="pc ${S.repeat!=='none'?'on':''}" onclick="toggleRepeat();renderMFP()" ${!isMusic?'style="opacity:.3;pointer-events:none"':''} aria-label="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 4px">
<button onclick="${isMusic?'toggleLike();renderMFP()':`toggleFavRadio('${s.id}');renderMFP()`}" style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:${lk?'var(--accent)':'var(--t3)'}" aria-label="Like"><svg viewBox="0 0 24 24" fill="${lk?'currentColor':'none'}" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
<button onclick="openFX()" style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--t3)" aria-label="Audio FX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 20V4"/></svg></button>
<button onclick="cycleSpeed();renderMFP()" style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:${S.speed!==1?'var(--accent)':'var(--t3)'};font-size:8px;font-weight:800" aria-label="Speed">${S.speed===1?'1x':S.speed+'x'}</button>
${isRadio?`<button onclick="toggleRadioRec();renderMFP()" style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:${S.recording?'#ef4444':'var(--t3)'}" aria-label="Record"><svg viewBox="0 0 24 24" fill="${S.recording?'#ef4444':'none'}" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="6"/></svg></button>`:`<button onclick="togglePiP()" style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--t3)" aria-label="PiP"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="10" width="8" height="6" rx="1"/></svg></button>`}
</div>
${isMusic?`<div style="display:flex;gap:4px;padding:6px 0 2px;justify-content:center">
<button class="tab ${tab==='queue'?'on':''}" onclick="setMFPTab('queue')">Queue</button>
<button class="tab ${tab==='related'?'on':''}" onclick="setMFPTab('related')">Related</button>
<button class="tab ${tab==='lyrics'?'on':''}" onclick="setMFPTab('lyrics')">Lyrics</button>
</div>
<div id="mfpTabBody" style="max-height:180px;overflow-y:auto;margin-top:4px"></div>`:''}`;

    if(isMusic){
        const body=$('mfpTabBody');
        if(body){
            if(tab==='queue'&&typeof rpQueue==='function'){body.innerHTML=rpQueue();attachQueueDragHandlers(body)}
            else if(tab==='related'&&typeof rpRelated==='function')body.innerHTML=rpRelated();
            else if(tab==='lyrics'&&typeof rpLyr==='function')body.innerHTML=rpLyr();
        }
    }
}
// The fix: re-render whenever a new track actually starts/stops, catching
// auto-advance, radio/TV switches, and failover — not just manual taps.
au.addEventListener('play',()=>{if(S.mfpOpen)renderMFP()});
au.addEventListener('pause',()=>{if(S.mfpOpen)renderMFP()});
au.addEventListener('timeupdate',()=>{
    if(S.mfpOpen&&S.mode==='music'){
        const bar=document.querySelector('.mfp .p-fill');if(bar&&au.duration)bar.style.width=(au.currentTime/au.duration*100)+'%';
        const tc=document.querySelector('.mfp .p-time');if(tc)tc.textContent=fmt(au.currentTime);
    }
});

function showMFPMenu(){
    const s=S.cur;if(!s)return;
    const sa=esc(s.artist||'').replace(/'/g,"\\'");
    const isMusic=S.mode==='music';
    $('mBox').innerHTML=`<h2 style="font-size:13px">${esc(s.title)}</h2><p style="font-size:8px;color:var(--t2);margin-bottom:8px">${esc(s.artist)}</p>
${isMusic?`<button class="abtn sec" style="width:100%;justify-content:center;margin-bottom:3px" onclick="goArtist('${sa}','${s.artistId||''}');closeModal();closeMFP()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Go to Artist</button>`:''}
${isMusic&&s.albumId?`<button class="abtn sec" style="width:100%;justify-content:center;margin-bottom:3px" onclick="goAlbum('${s.albumId}','${esc(s.album||'').replace(/'/g,"\\'")}');closeModal();closeMFP()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/></svg>Go to Album</button>`:''}
${isMusic?`<button class="abtn sec" style="width:100%;justify-content:center;margin-bottom:3px" onclick="songRadio(S.cur);closeModal();closeMFP()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/></svg>Song Radio</button>`:''}
<button class="abtn sec" style="width:100%;justify-content:center;margin-bottom:3px" onclick="showSleepMenu();closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>Sleep Timer</button>
<button class="abtn sec" style="width:100%;justify-content:center;margin-bottom:3px" onclick="togglePiP();closeMFP()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="10" width="8" height="6" rx="1"/></svg>Picture-in-Picture</button>
${S.mode==='radio'?`<button class="abtn sec" style="width:100%;justify-content:center;margin-bottom:3px" onclick="stopRadio();closeModal();closeMFP()">Stop Radio</button>`:''}
${S.mode==='tv'?`<button class="abtn sec" style="width:100%;justify-content:center;margin-bottom:3px" onclick="stopTV();closeModal();closeMFP()">Stop TV</button>`:''}
<div class="m-btns"><button class="m-btn ghost" onclick="closeModal()">Close</button></div>`;
    $('mBg').classList.add('show');
}

/* ===== MOBILE GESTURES ===== */
let _mpTX=0;
const mobPl=$('mobPlayer');
if(mobPl){
    mobPl.addEventListener('touchstart',e=>{_mpTX=e.touches[0].clientX},{passive:true});
    mobPl.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-_mpTX;if(Math.abs(dx)>40&&S.mode==='music'){dx>0?playPrev():playNext()}},{passive:true});
}
let _mfpY=0;
$('mfp').addEventListener('touchstart',e=>{_mfpY=e.touches[0].clientY},{passive:true});
$('mfp').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-_mfpY>55)closeMFP()},{passive:true});

let _lpT=null;
document.addEventListener('touchstart',e=>{
    const tr=e.target.closest('.tr');if(!tr)return;
    const idx=[...tr.parentElement.children].indexOf(tr);
    _lpT=setTimeout(()=>{if(navigator.vibrate)navigator.vibrate(15);showCtx({preventDefault(){},stopPropagation(){},clientX:e.touches[0].clientX,clientY:e.touches[0].clientY},idx)},350);
},{passive:true});
document.addEventListener('touchend',()=>{if(_lpT){clearTimeout(_lpT);_lpT=null}},{passive:true});
document.addEventListener('touchmove',()=>{if(_lpT){clearTimeout(_lpT);_lpT=null}},{passive:true});

/* ╔══════════════════════════════════════════════════════════════╗
   ║ CENTRAL NAVIGATION (single source of truth for all tabs)     ║
   ╚══════════════════════════════════════════════════════════════╝ */
function navTo(v){
    setNav(v);
    if(v!=='tv')cleanupTV();
    if(v==='home')showHome();
    else if(v==='search')showSearchPage();
    else if(v==='artists')showArtistsPage();
    else if(v==='radio')showRadioPage();
    else if(v==='tv')showTVPage();
    else if(v==='library')showMobLib();
}
let _lastN={v:'',t:0};
$$('.nav-i,.mob-i').forEach(btn=>{
    btn.addEventListener('click',()=>{
        const v=btn.dataset.v,now=Date.now();
        navTo(v);
        if(_lastN.v===v&&now-_lastN.t<280)$('center').scrollTo({top:0,behavior:'smooth'});
        _lastN={v,t:now};
    });
});

/* ╔══════════════════════════════════════════════════════════════╗
   ║ SMART QUEUE FALLBACK — uses Part 3's related-songs engine     ║
   ╚══════════════════════════════════════════════════════════════╝ */
async function handleSmartQueueEnd(){
    if(!S.settings.smartQueue||!S.cur){S.playing=false;updIcons();return}
    toast('Finding more songs...');
    const excludeIds=new Set([...S.songs.map(s=>s.id),...S.history.slice(0,20).map(s=>s.id)]);
    const more=await getRelatedSongs(S.cur,{limit:10,excludeIds});
    if(!more.length){S.playing=false;updIcons();toast('Queue ended');return}
    const startAt=S.songs.length;
    S.songs=[...S.songs,...more];
    rebuildQueue();
    toast(`+${more.length} similar songs`,'','ok');
    playSong(startAt,{internal:true});
}

/* ╔══════════════════════════════════════════════════════════════╗
   ║ KEYBOARD SHORTCUTS                                            ║
   ╚══════════════════════════════════════════════════════════════╝ */
document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.key==='?'){e.preventDefault();showKeys();return}
    const ctrl=e.ctrlKey||e.metaKey;
    switch(e.code){
        case'Space':e.preventDefault();togglePlay();break;
        case'ArrowRight':e.preventDefault();e.shiftKey?playNext():au.duration&&S.mode==='music'&&(au.currentTime=Math.min(au.duration,au.currentTime+10));break;
        case'ArrowLeft':e.preventDefault();e.shiftKey?playPrev():au.duration&&S.mode==='music'&&(au.currentTime=Math.max(0,au.currentTime-10));break;
        case'ArrowUp':e.preventDefault();setVol(Math.min(1,S.vol+.05));break;
        case'ArrowDown':e.preventDefault();setVol(Math.max(0,S.vol-.05));break;
        case'KeyN':if(!ctrl)playNext();break;
        case'KeyP':if(!ctrl){e.preventDefault();playPrev()}break;
        case'KeyM':toggleMute();break;
        case'KeyS':if(!ctrl)toggleShuffle();break;
        case'KeyR':if(!ctrl&&!e.shiftKey)toggleRepeat();break;
        case'KeyL':if(!ctrl)setRP('lyrics');break;
        case'KeyQ':if(!ctrl)setRP('queue');break;
        case'KeyV':if(!ctrl)setRP('viz');break;
        case'KeyO':if(!ctrl){e.preventDefault();openNPO()}break;
        case'KeyA':if(!ctrl){e.preventDefault();showArtistsPage()}break;
        case'KeyE':if(!ctrl){e.preventDefault();openFX()}break;
        case'KeyT':if(!ctrl){e.preventDefault();showTVPage()}break;
        case'Slash':case'KeyF':if(!ctrl){e.preventDefault();showSearchPage();inp.focus()}break;
        case'Escape':inp.blur();hideCtx();closeModal();closeMFP();closeNPO();closeFX();closeSettings();hideSug();break;
        case'Home':e.preventDefault();showHome();break;
        case'Digit1':if(!ctrl)showHome();break;
        case'Digit2':if(!ctrl)showRadioPage();break;
        case'Digit3':if(!ctrl)showTVPage();break;
        case'KeyK':if(ctrl){e.preventDefault();showSearchPage();inp.focus()}break;
    }
});
function showKeys(){
    const keys=[
        ['Space','Play / Pause'],['← / →','Seek ±10s'],['Shift+→','Next'],['Shift+←','Previous'],
        ['↑ / ↓','Volume'],['M','Mute'],['S','Shuffle'],['R','Repeat'],
        ['L','Lyrics'],['Q','Queue'],['V','Visualizer'],['O','Now Playing'],['E','Audio FX'],
        ['A','Artists'],['T','TV'],['/ or F','Search'],['Ctrl+K','Quick Search'],
        ['1','Home'],['2','Radio'],['3','TV'],['Esc','Close all'],['?','This help']
    ];
    $('mBox').innerHTML=`<h2>Keyboard Shortcuts</h2><div style="display:grid;grid-template-columns:auto 1fr;gap:2px 9px;font-size:8px;line-height:1.9">${keys.map(([k,d])=>`<kbd style="padding:1px 5px;background:var(--bg4);border-radius:3px;font-size:7px;font-weight:700;text-align:center;border:1px solid var(--brd)">${k}</kbd><span style="color:var(--t2)">${d}</span>`).join('')}</div><div class="m-btns"><button class="m-btn pri" onclick="closeModal()">Got it</button></div>`;
    $('mBg').classList.add('show');
}

/* ===== BACK BUTTON ===== */
window.addEventListener('popstate',()=>{
    if(S.mfpOpen){closeMFP();history.pushState(null,'');return}
    if(S.npoOpen){closeNPO();history.pushState(null,'');return}
    if($('mBg').classList.contains('show')){closeModal();history.pushState(null,'');return}
    if($('fxPanel').classList.contains('show')){closeFX();history.pushState(null,'');return}
    if($('settingsWrap').classList.contains('show')){closeSettings();history.pushState(null,'');return}
    if(S.view!=='home'){goBack();history.pushState(null,'')}
});
history.pushState(null,'');

/* ===== GLOBAL ERROR HANDLING ===== */
window.addEventListener('unhandledrejection',e=>e.preventDefault());
window.addEventListener('error',e=>{if(e.target?.tagName==='IMG')e.preventDefault()},{capture:true});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.style.visibility='hidden'},{capture:true});

/* ===== NETWORK MONITORING ===== */
let _wasOff=false;
window.addEventListener('online',()=>{if(_wasOff){_wasOff=false;toast('Back online','','ok');if(!SRC.direct.alive&&!SRC.tp.length)initSources()}});
window.addEventListener('offline',()=>{_wasOff=true;toast('You are offline',2500,'err')});

/* ===== SUPPLEMENTARY PERIODIC CLEANUP (TV + radio list trimming) ===== */
setInterval(()=>{
    if(S.radioStations.length>300)S.radioStations.length=200;
    if(S.mode!=='tv'&&S.tvHls){S.tvHls.destroy();S.tvHls=null}
},25000);

/* ╔══════════════════════════════════════════════════════════════╗
   ║ INIT                                                          ║
   ╚══════════════════════════════════════════════════════════════╝ */
function applyAllSettings(){
    applySettings();
    speedIdx=Math.max(0,SPEEDS.indexOf(S.speed));
    $('bShuf')?.classList.toggle('on',S.shuffle);
    $('bRep')?.classList.toggle('on',S.repeat!=='none');
}

async function init(){
    applyAllSettings();

    const restored=restoreSess();
    renderLib();updNavBtns();
    au.volume=S.vol;$('vFill').style.width=(S.vol*100)+'%';updateVolIcon();

    if(restored&&S.cur){
        rebuildQueue();
        updPlayerUI();updMobP();updIcons();updModeUI();
        renderRP();
        showHome(true);
        toast('Session restored','','ok');
    }else{
        showHome(true);
    }

    await initSources();

    console.log('%c♪ Ringify v6%c Ready','background:linear-gradient(90deg,#1ed760,#a3e635);color:#000;padding:4px 10px;border-radius:4px;font-weight:900;font-size:12px','color:#6a6a6a;padding:4px');
    console.log('%cFeatures:%c Music · Radio · TV · Real Queue Engine · Related Songs · Lyrics · EQ · Visualizer · Themes · PiP · Recording · Desktop Now-Playing Overlay','color:#1ed760;font-weight:700;font-size:8px','color:#6a6a6a;font-size:8px');
}
init();
</script>
